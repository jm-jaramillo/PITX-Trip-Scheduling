<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Operator profile · PITX Bus Bay Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="nav" id="nav"></header>

    <main class="wrap wrap-narrow">
      <div class="page-head">
        <div>
          <p class="eyebrow">Provincial Slot Booking &middot; Company Details</p>
          <h1>Operator profile</h1>
          <p class="subtle">
            One-time company details, matching the top of the PITX/MWM
            Terminals registration form. Save any time you need to update
            them &mdash; no approval needed for this page.
          </p>
        </div>
      </div>

      <div class="hidden" id="message"></div>

      <form class="card grid grid-2" id="profile-form">
        <div class="field span-all">
          <label for="company_name">Company name</label>
          <input id="company_name" />
        </div>
        <div class="field span-all">
          <label for="company_owner">Company owner</label>
          <input id="company_owner" />
        </div>
        <div class="field">
          <label for="tin_no">TIN No.</label>
          <input id="tin_no" />
        </div>
        <div class="field">
          <label for="or_serial_number">Serial Number (OR)</label>
          <input id="or_serial_number" />
        </div>

        <div class="field">
          <label for="has_booking_system">Booking system</label>
          <select id="has_booking_system">
            <option value="false">No</option>
            <option value="true">Yes</option>
          </select>
        </div>
        <div class="field">
          <label for="booking_system_name">Name of software/app/website</label>
          <input
            id="booking_system_name"
            placeholder="Only if you use one"
          />
        </div>

        <div class="field span-all">
          <label for="nau">NAU</label>
          <input id="nau" />
        </div>

        <h2 class="span-all" style="margin-top: 8px">Contact person 1</h2>
        <div class="field">
          <label for="contact1_name">Name</label>
          <input id="contact1_name" />
        </div>
        <div class="field">
          <label for="contact1_number">Contact No.</label>
          <input id="contact1_number" />
        </div>
        <div class="field span-all">
          <label for="contact1_position">Position</label>
          <input id="contact1_position" />
        </div>

        <h2 class="span-all">Contact person 2</h2>
        <div class="field">
          <label for="contact2_name">Name</label>
          <input id="contact2_name" />
        </div>
        <div class="field">
          <label for="contact2_number">Contact No.</label>
          <input id="contact2_number" />
        </div>
        <div class="field span-all">
          <label for="contact2_position">Position</label>
          <input id="contact2_position" />
        </div>

        <div class="span-all">
          <button type="submit" class="btn-primary" id="save-btn">
            Save profile
          </button>
        </div>
      </form>
    </main>

    <script type="module">
      import {
        supabase,
        guardPage,
        renderNav,
        showMessage,
      } from "./assets/app.js";

      const profile = await guardPage("operator");
      if (!profile) throw new Error("unauthorised");
      renderNav(profile);

      const FIELDS = [
        "company_name",
        "company_owner",
        "tin_no",
        "or_serial_number",
        "booking_system_name",
        "nau",
        "contact1_name",
        "contact1_number",
        "contact1_position",
        "contact2_name",
        "contact2_number",
        "contact2_position",
      ];

      await load();
      document
        .getElementById("profile-form")
        .addEventListener("submit", save);

      async function load() {
        const { data, error } = await supabase
          .from("operator_profiles")
          .select("*")
          .eq("operator_id", profile.id)
          .maybeSingle();

        if (error) {
          showMessage("message", error.message);
          return;
        }

        if (!data) return; // Nothing saved yet - leave the form blank.

        for (const field of FIELDS) {
          document.getElementById(field).value = data[field] ?? "";
        }
        document.getElementById("has_booking_system").value = String(
          data.has_booking_system ?? false
        );
      }

      async function save(event) {
        event.preventDefault();
        showMessage("message", "");
        const saveBtn = document.getElementById("save-btn");
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving…";

        const values = { operator_id: profile.id };
        for (const field of FIELDS) {
          values[field] = document.getElementById(field).value.trim() || null;
        }
        values.has_booking_system =
          document.getElementById("has_booking_system").value === "true";

        const { error } = await supabase
          .from("operator_profiles")
          .upsert(values, { onConflict: "operator_id" });

        saveBtn.disabled = false;
        saveBtn.textContent = "Save profile";

        if (error) {
          showMessage("message", error.message);
          return;
        }
        showMessage("message", "Profile saved.", "ok");
      }
    </script>
  </body>
</html>
