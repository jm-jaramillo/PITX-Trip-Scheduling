<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vehicles · PITX Bus Bay Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
    <style>
      /* Small popover for the Columns toggle - the rest of the site has no
         existing dropdown component to reuse, so this is scoped to this
         page only and leans on the same tokens/radii as the shared sheet. */
      .columns-control {
        position: relative;
      }

      .columns-popover {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        z-index: 30;
        min-width: 220px;
        max-height: 320px;
        overflow-y: auto;
        background: var(--surface);
        border: 1px solid oklch(88% 0.006 260);
        border-radius: var(--r-card);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
        padding: 10px;
      }

      .columns-popover label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-2);
        padding: 5px 4px;
        border-radius: 6px;
        cursor: pointer;
      }

      .columns-popover label:hover {
        background: var(--ground);
      }

      .columns-popover input {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <header class="nav" id="nav"></header>

    <main class="wrap">
      <div class="page-head">
        <div>
          <p class="eyebrow">Transport Operations &middot; Fleet Database</p>
          <h1>Vehicles</h1>
          <p class="subtle">
            Every vehicle registered across all operators, any status - not
            just the pending queue on <strong>Vehicle approvals</strong>.
          </p>
        </div>
        <p class="subtle" id="summary-count"></p>
      </div>

      <div class="toolbar" style="justify-content: space-between; margin-bottom: 20px">
        <div class="field" style="max-width: 360px; margin-bottom: 0">
          <label for="search">Search</label>
          <input id="search" placeholder="Plate no., operator, bus no., or route…" />
        </div>
        <div class="mode-switch" role="tablist" id="status-filter">
          <button type="button" class="mode-tab is-active" data-filter="all">All</button>
          <button type="button" class="mode-tab" data-filter="approved">Approved</button>
          <button type="button" class="mode-tab" data-filter="pending">Pending</button>
          <button type="button" class="mode-tab" data-filter="rejected">Declined</button>
        </div>
        <div class="columns-control">
          <button type="button" class="btn-outline" id="columns-toggle">Columns</button>
          <div class="columns-popover hidden" id="columns-popover"></div>
        </div>
        <button type="button" class="btn-outline" id="export-csv">Export CSV</button>
      </div>

      <div class="hidden" id="message"></div>
      <div id="vehicle-list"></div>
    </main>

    <dialog class="details-dialog" id="details-dialog">
      <h2 class="dialog-title" id="details-title"></h2>
      <div id="details-body"></div>
      <div class="dialog-actions">
        <button type="button" class="btn-outline" id="details-close">Close</button>
      </div>
    </dialog>

    <script type="module">
      import {
        supabase,
        guardPage,
        renderNav,
        showMessage,
        statusBadge,
        ltfrbBadge,
        expiryCell,
        vehicleDetailsHtml,
        applyVehicleHighlightFromQuery,
        escapeHtml,
        downloadCsv,
      } from "./assets/app.js";

      const profile = await guardPage("staff");
      if (!profile) throw new Error("unauthorised");
      renderNav(profile);

      let allVehicles = [];
      let vehiclesById = new Map();
      let statusFilter = "all";
      let sortKey = null;
      let sortDir = "asc";
      // Supabase caps a single request at 1000 rows (PostgREST's default
      // max-rows setting) - the masterlist import (migration 0021/0022,
      // ~1,900 rows) pushed this table past that. Must be declared before
      // load() runs below, or it's still in its temporal dead zone.
      const PAGE_SIZE = 1000;

      // Every column the table can show, in on-screen order. `csv` renders
      // the plain-text value for export - separate from the `<td>` markup
      // below since several columns (status/LTFRB badges, aircon) render
      // as HTML on screen but should be plain text in the exported file.
      const COLUMNS = [
        { key: "plate_no", label: "Plate No.", csv: (v) => v.plate_no ?? "" },
        {
          key: "operator",
          label: "Operator",
          csv: (v) => v.profiles?.operator_name || v.profiles?.username || "",
        },
        { key: "status", label: "Status", csv: (v) => v.status ?? "" },
        { key: "ltfrb", label: "LTFRB", csv: (v) => v.ltfrb_status ?? "" },
        { key: "case_number", label: "Case No.", csv: (v) => v.case_number ?? "" },
        { key: "mv_file_number", label: "MV File #", csv: (v) => v.mv_file_number ?? "" },
        { key: "or_number", label: "OR No.", csv: (v) => v.or_number ?? "" },
        { key: "cr_number", label: "CR No.", csv: (v) => v.cr_number ?? "" },
        { key: "chassis_no", label: "Chassis No.", csv: (v) => v.chassis_no ?? "" },
        { key: "franchise", label: "Franchise", csv: (v) => v.franchise ?? "" },
        { key: "sticker_no", label: "Sticker No.", csv: (v) => v.sticker_no ?? "" },
        { key: "cpc_validity", label: "CPC validity", csv: (v) => v.cpc_validity ?? "" },
        { key: "orcr_validity", label: "OR/CR validity", csv: (v) => v.orcr_validity ?? "" },
        { key: "route", label: "Route", csv: (v) => v.route ?? "" },
        { key: "bus_number", label: "Bus No.", csv: (v) => v.bus_number ?? "" },
        { key: "seating_capacity", label: "Seating", csv: (v) => v.seating_capacity ?? "" },
        { key: "seat_type", label: "Seat", csv: (v) => v.seat_type ?? "" },
        { key: "aircon", label: "Aircon", csv: (v) => airconLabel(v.aircon) },
        { key: "date_granted", label: "Date granted", csv: (v) => v.date_granted ?? "" },
        { key: "date_expiry", label: "Date expiry", csv: (v) => v.date_expiry ?? "" },
        { key: "rejection_reason", label: "Note", csv: (v) => v.rejection_reason ?? "" },
        { key: "documents", label: "Documents", csv: () => "" },
      ];

      // Default subset shown on first visit - the rest stay one click away
      // via the Columns popover. Whatever the staff member picks after that
      // persists in localStorage under this key, so it survives a reload.
      const COLUMNS_STORAGE_KEY = "pitx.vehiclesDatabase.columns";
      const DEFAULT_VISIBLE_COLUMNS = [
        "plate_no",
        "operator",
        "route",
        "bus_number",
        "status",
        "cpc_validity",
        "orcr_validity",
        "ltfrb",
      ];
      let visibleColumns = loadVisibleColumns();

      function loadVisibleColumns() {
        try {
          const stored = JSON.parse(localStorage.getItem(COLUMNS_STORAGE_KEY));
          if (Array.isArray(stored) && stored.length) {
            const validKeys = new Set(COLUMNS.map((c) => c.key));
            return new Set(stored.filter((key) => validKeys.has(key)));
          }
        } catch {
          // ignore malformed/absent localStorage value, fall back to defaults
        }
        return new Set(DEFAULT_VISIBLE_COLUMNS);
      }

      function saveVisibleColumns() {
        localStorage.setItem(COLUMNS_STORAGE_KEY, JSON.stringify([...visibleColumns]));
      }

      initStatusFilter();
      initDetailsDialog();
      initColumnsPopover();
      document.getElementById("search").addEventListener("input", render);
      document.getElementById("export-csv").addEventListener("click", exportCsv);
      await load();
      applyVehicleHighlightFromQuery(openDetails);

      function initColumnsPopover() {
        const toggle = document.getElementById("columns-toggle");
        const popover = document.getElementById("columns-popover");

        popover.innerHTML = COLUMNS.map(
          (col) => `
            <label>
              <input type="checkbox" data-col-toggle="${col.key}" ${
            visibleColumns.has(col.key) ? "checked" : ""
          } />
              ${escapeHtml(col.label)}
            </label>`
        ).join("");

        toggle.addEventListener("click", (e) => {
          e.stopPropagation();
          popover.classList.toggle("hidden");
        });

        popover.querySelectorAll("[data-col-toggle]").forEach((checkbox) => {
          checkbox.addEventListener("change", () => {
            const key = checkbox.dataset.colToggle;
            if (checkbox.checked) visibleColumns.add(key);
            else visibleColumns.delete(key);
            saveVisibleColumns();
            applyColumnVisibility();
          });
        });

        // Clicking anywhere outside the popover closes it, same as a
        // standard dropdown.
        document.addEventListener("click", (e) => {
          if (!popover.classList.contains("hidden") && !e.target.closest(".columns-control")) {
            popover.classList.add("hidden");
          }
        });
      }

      // Re-applied after every render() since the table markup is rebuilt
      // from scratch on each search/filter/sort change.
      function applyColumnVisibility() {
        document.querySelectorAll("[data-col]").forEach((cell) => {
          cell.classList.toggle("hidden", !visibleColumns.has(cell.dataset.col));
        });
      }

      function exportCsv() {
        const rows = currentRows();
        const columns = COLUMNS.filter((col) => visibleColumns.has(col.key));
        downloadCsv(
          "vehicles.csv",
          columns.map((col) => col.label),
          rows.map((v) => columns.map((col) => col.csv(v)))
        );
      }

      function initStatusFilter() {
        document.querySelectorAll("#status-filter [data-filter]").forEach((btn) => {
          btn.addEventListener("click", () => {
            statusFilter = btn.dataset.filter;
            document
              .querySelectorAll("#status-filter [data-filter]")
              .forEach((b) => b.classList.toggle("is-active", b === btn));
            render();
          });
        });
      }

      function airconLabel(aircon) {
        if (aircon === true) return "Aircon";
        if (aircon === false) return "Non-aircon";
        return "—";
      }

      // Plate No., Operator, CPC validity, OR/CR validity are sortable -
      // click a header to sort by it, click again to flip direction.
      // Nulls always sort last regardless of direction, so an empty
      // validity date doesn't jump to the top on descending sort.
      const SORT_VALUE = {
        plate_no: (v) => v.plate_no?.toUpperCase() ?? null,
        operator: (v) => (v.profiles?.operator_name || v.profiles?.username)?.toUpperCase() ?? null,
        cpc_validity: (v) => v.cpc_validity ?? null,
        orcr_validity: (v) => v.orcr_validity ?? null,
      };

      function sortTh(label, key) {
        const active = sortKey === key;
        const arrow = active ? (sortDir === "asc" ? " &#9650;" : " &#9660;") : "";
        return `<th class="sortable" data-sort="${key}" data-col="${key}">${escapeHtml(label)}${arrow}</th>`;
      }

      function applySort(rows) {
        if (!sortKey) return rows;
        const getValue = SORT_VALUE[sortKey];
        const dir = sortDir === "asc" ? 1 : -1;
        return [...rows].sort((a, b) => {
          const av = getValue(a);
          const bv = getValue(b);
          if (av == null && bv == null) return 0;
          if (av == null) return 1;
          if (bv == null) return -1;
          if (av < bv) return -1 * dir;
          if (av > bv) return 1 * dir;
          return 0;
        });
      }

      // Pages through with .range() until a page comes back short of the
      // page size, so a plain .select() no longer silently truncates the
      // fleet list once it's past 1000 rows.
      async function load() {
        allVehicles = [];
        let from = 0;
        for (;;) {
          // vehicles has two FKs into profiles (operator_id, decided_by), so
          // the embed needs the constraint name to disambiguate which.
          const { data, error } = await supabase
            .from("vehicles")
            .select(
              "id, plate_no, case_number, mv_file_number, or_number, cr_number, chassis_no, franchise, cpc_validity, orcr_validity, sticker_no, route, bus_number, seating_capacity, seat_type, aircon, date_granted, date_expiry, status, ltfrb_status, rejection_reason, photo_path, supporting_doc_path, supporting_doc_name, created_at, profiles!vehicles_operator_id_fkey ( username, operator_name )"
            )
            .order("created_at", { ascending: false })
            .range(from, from + PAGE_SIZE - 1);

          if (error) {
            showMessage("message", error.message);
            return;
          }

          allVehicles.push(...(data ?? []));
          if (!data || data.length < PAGE_SIZE) break;
          from += PAGE_SIZE;
        }
        vehiclesById = new Map(allVehicles.map((v) => [v.id, v]));
        render();
      }

      /* -------------------------------------------------- details dialog */

      function initDetailsDialog() {
        document
          .getElementById("details-close")
          .addEventListener("click", () => document.getElementById("details-dialog").close());
      }

      async function openDetails(vehicleId) {
        const v = vehiclesById.get(vehicleId);
        if (!v) return;

        const operatorLabel = v.profiles?.operator_name || v.profiles?.username || "—";
        document.getElementById("details-title").textContent = v.plate_no;
        document.getElementById("details-body").innerHTML = vehicleDetailsHtml(v, operatorLabel);
        document.getElementById("details-dialog").showModal();

        const links = [];
        if (v.photo_path) {
          const { data } = await supabase.storage.from("vehicle-docs").createSignedUrl(v.photo_path, 300);
          if (data?.signedUrl) links.push(`<a href="${data.signedUrl}" target="_blank" rel="noopener">OR/CR photo</a>`);
        }
        if (v.supporting_doc_path) {
          const { data } = await supabase.storage.from("vehicle-docs").createSignedUrl(v.supporting_doc_path, 300);
          if (data?.signedUrl) {
            links.push(
              `<a href="${data.signedUrl}" target="_blank" rel="noopener">${escapeHtml(
                v.supporting_doc_name || "Supporting doc"
              )}</a>`
            );
          }
        }
        const docsEl = document.getElementById("details-documents");
        if (docsEl) docsEl.innerHTML = links.length ? links.join("") : "—";
      }

      // Shared by render() and exportCsv() so the CSV always matches
      // exactly what's on screen - same status filter, search, and sort.
      function currentRows() {
        const query = document.getElementById("search").value.trim().toLowerCase();

        let rows =
          statusFilter === "all"
            ? allVehicles
            : allVehicles.filter((v) => v.status === statusFilter);

        if (query) {
          rows = rows.filter((v) =>
            [v.plate_no, v.bus_number, v.profiles?.operator_name, v.profiles?.username, v.route]
              .filter(Boolean)
              .some((s) => s.toLowerCase().includes(query))
          );
        }

        return applySort(rows);
      }

      function render() {
        const rows = currentRows();

        document.getElementById("summary-count").textContent =
          `${allVehicles.length} vehicle${allVehicles.length === 1 ? "" : "s"} registered across all operators`;

        const host = document.getElementById("vehicle-list");

        if (rows.length === 0) {
          host.innerHTML = `<p class="empty">${
            allVehicles.length === 0 ? "No vehicles registered yet." : "No matches."
          }</p>`;
          return;
        }

        host.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  ${sortTh("Plate No.", "plate_no")}${sortTh("Operator", "operator")}
                  <th data-col="status">Status</th><th data-col="ltfrb">LTFRB</th>
                  <th data-col="case_number">Case No.</th>
                  <th data-col="mv_file_number">MV File #</th><th data-col="or_number">OR No.</th><th data-col="cr_number">CR No.</th>
                  <th data-col="chassis_no">Chassis No.</th><th data-col="franchise">Franchise</th><th data-col="sticker_no">Sticker No.</th>
                  ${sortTh("CPC validity", "cpc_validity")}${sortTh("OR/CR validity", "orcr_validity")}
                  <th data-col="route">Route</th><th data-col="bus_number">Bus No.</th><th data-col="seating_capacity">Seating</th>
                  <th data-col="seat_type">Seat</th><th data-col="aircon">Aircon</th><th data-col="date_granted">Date granted</th>
                  <th data-col="date_expiry">Date expiry</th><th data-col="rejection_reason">Note</th>
                  <th data-col="documents">Documents</th>
                </tr>
              </thead>
              <tbody>
                ${rows
                  .map((v) => {
                    const operatorLabel =
                      v.profiles?.operator_name || v.profiles?.username || "—";
                    return `
                  <tr class="row-clickable" data-vehicle-id="${escapeHtml(v.id)}">
                    <td class="cell-strong" data-label="Plate No." data-col="plate_no">${escapeHtml(v.plate_no)}</td>
                    <td data-label="Operator" data-col="operator">${escapeHtml(operatorLabel)}</td>
                    <td data-label="Status" data-col="status">${statusBadge(v.status)}</td>
                    <td data-label="LTFRB" data-col="ltfrb">${ltfrbBadge(v.ltfrb_status)}</td>
                    <td data-label="Case No." data-col="case_number">${escapeHtml(v.case_number ?? "—")}</td>
                    <td data-label="MV File #" data-col="mv_file_number">${escapeHtml(v.mv_file_number ?? "—")}</td>
                    <td data-label="OR No." data-col="or_number">${escapeHtml(v.or_number ?? "—")}</td>
                    <td data-label="CR No." data-col="cr_number">${escapeHtml(v.cr_number ?? "—")}</td>
                    <td data-label="Chassis No." data-col="chassis_no">${escapeHtml(v.chassis_no ?? "—")}</td>
                    <td data-label="Franchise" data-col="franchise">${escapeHtml(v.franchise ?? "—")}</td>
                    <td data-label="Sticker No." data-col="sticker_no">${escapeHtml(v.sticker_no ?? "—")}</td>
                    <td data-label="CPC validity" data-col="cpc_validity">${expiryCell(v.cpc_validity, escapeHtml)}</td>
                    <td data-label="OR/CR validity" data-col="orcr_validity">${expiryCell(v.orcr_validity, escapeHtml)}</td>
                    <td data-label="Route" data-col="route">${escapeHtml(v.route ?? "—")}</td>
                    <td data-label="Bus No." data-col="bus_number">${escapeHtml(v.bus_number ?? "—")}</td>
                    <td data-label="Seating" data-col="seating_capacity">${v.seating_capacity ?? "—"}</td>
                    <td data-label="Seat" data-col="seat_type">${escapeHtml(v.seat_type ?? "—")}</td>
                    <td data-label="Aircon" data-col="aircon">${airconLabel(v.aircon)}</td>
                    <td data-label="Date granted" data-col="date_granted">${escapeHtml(v.date_granted ?? "—")}</td>
                    <td data-label="Date expiry" data-col="date_expiry">${escapeHtml(v.date_expiry ?? "—")}</td>
                    <td data-label="Note" data-col="rejection_reason">${escapeHtml(v.rejection_reason ?? "—")}</td>
                    <td data-label="Documents" data-col="documents" data-vehicle-docs="${escapeHtml(v.id)}">&hellip;</td>
                  </tr>`;
                  })
                  .join("")}
              </tbody>
            </table>
          </div>
        `;

        resolveDocLinks(rows);
        applyColumnVisibility();

        host.querySelectorAll("[data-sort]").forEach((th) => {
          th.addEventListener("click", () => {
            const key = th.dataset.sort;
            sortDir = sortKey === key && sortDir === "asc" ? "desc" : "asc";
            sortKey = key;
            render();
          });
        });

        // Anything but the row itself (e.g. a Documents link) should do
        // its own thing rather than also popping the details dialog.
        host.querySelectorAll("[data-vehicle-id]").forEach((tr) => {
          tr.addEventListener("click", (e) => {
            if (e.target.closest("a")) return;
            openDetails(tr.dataset.vehicleId);
          });
        });
      }

      // Signed URLs are resolved after the table paints (rather than
      // blocking the initial render on every row's storage round-trip),
      // same reasoning as the other pages that link into vehicle-docs.
      async function resolveDocLinks(rows) {
        await Promise.all(
          rows.map(async (v) => {
            const cell = document.querySelector(`[data-vehicle-docs="${v.id}"]`);
            if (!cell) return;

            const links = [];
            if (v.photo_path) {
              const { data } = await supabase.storage
                .from("vehicle-docs")
                .createSignedUrl(v.photo_path, 300);
              if (data?.signedUrl) {
                links.push(
                  `<a href="${data.signedUrl}" target="_blank" rel="noopener">OR/CR photo</a>`
                );
              }
            }
            if (v.supporting_doc_path) {
              const { data } = await supabase.storage
                .from("vehicle-docs")
                .createSignedUrl(v.supporting_doc_path, 300);
              if (data?.signedUrl) {
                links.push(
                  `<a href="${data.signedUrl}" target="_blank" rel="noopener">${escapeHtml(
                    v.supporting_doc_name || "Supporting doc"
                  )}</a>`
                );
              }
            }
            cell.innerHTML = links.length ? links.join("<br />") : "—";
          })
        );
      }
    </script>
  </body>
</html>
