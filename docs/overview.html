<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Overview · PITX Trip Scheduling</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
    <style>
      /* Page-local additions - just this page's quick-link grid and the
         "approaching lockout" alert list, styled to sit alongside the
         shared .kpis/.kpi/.hint/.warn classes from styles.css rather than
         duplicating them. */
      .kpi-link {
        display: block;
        text-decoration: none;
        color: inherit;
      }
      .kpi-link:hover .kpi {
        border-color: var(--title, #333);
      }

      .lockout-card {
        border-radius: var(--r-card-sm, 14px);
        padding: 14px 18px;
        margin-bottom: 18px;
      }
      .lockout-card.is-urgent {
        background: var(--amber-wash);
        color: var(--amber-ink);
      }
      .lockout-card.is-calm {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--label);
      }
      .lockout-title {
        font-weight: 700;
        margin: 0 0 8px;
      }
      .lockout-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .lockout-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        background: rgba(255, 255, 255, 0.35);
        border-radius: 10px;
        padding: 8px 12px;
      }
      .lockout-list a {
        color: inherit;
        font-weight: 700;
        text-decoration: underline;
        white-space: nowrap;
      }

      .quick-links {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        margin-top: 8px;
      }
      .quick-link {
        display: block;
        text-decoration: none;
        color: var(--title);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-card-sm, 14px);
        padding: 16px 18px;
        font-weight: 700;
        font-size: 14px;
        transition: border-color 0.15s ease;
      }
      .quick-link:hover {
        border-color: var(--title);
      }

      .section-head {
        margin: 28px 0 10px;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: oklch(52% 0.02 260);
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="nav"></aside>
      <div class="app-content">
        <main class="wrap">
      <div class="page-head">
        <div>
          <p class="eyebrow">Transport Operations &middot; Command Center</p>
          <h1>Overview</h1>
          <p class="subtle">
            A shift-start snapshot of everything waiting on staff - queue
            counts, requests approaching their booking-lockout window, and
            today's approved arrivals - plus quick links to every staff page.
          </p>
        </div>
      </div>

      <div class="kpis" id="kpis"></div>

      <p class="section-head">Approaching lockout</p>
      <div id="lockout"></div>

      <p class="section-head">Quick links</p>
      <div class="quick-links" id="quick-links"></div>
    </main>
      </div>
    </div>
      </div>
    </div>

    <script type="module">
      import {
        supabase,
        guardPage,
        renderNav,
        escapeHtml,
        todayISO,
        slotStartMillis,
        BOOKING_LEAD_TIME_MS,
        fetchAllRows,
        formatSlotStart,
        bookingOperatorHtml,
      } from "./assets/app.js";

      const profile = await guardPage("staff");
      if (!profile) throw new Error("unauthorised");
      renderNav(profile);

      // Half the booking-lockout window - requests inside this band are
      // still pending but will lose their lead time soon, so they're
      // surfaced here rather than only showing up once staff happen to
      // check the Pending requests queue.
      const URGENT_WINDOW_MS = BOOKING_LEAD_TIME_MS / 2;

      // Both derived from BOOKING_LEAD_TIME_MS rather than written out,
      // so the copy can't drift from the actual rule the way a hardcoded
      // "4-hour" did when the lockout dropped to 2 hours (#86).
      const LOCKOUT_HOURS = BOOKING_LEAD_TIME_MS / 3600000;
      const URGENT_HOURS = URGENT_WINDOW_MS / 3600000;
      const plural = (n) => (n === 1 ? "" : "s");

      renderQuickLinks();
      await load();

      async function load() {
        const today = todayISO();

        const [
          pendingBookingsRes,
          pendingVehiclesRes,
          transfersAwaitingStaffRes,
          transfersAwaitingOperatorRes,
          approvedTodayRes,
        ] = await Promise.all([
          fetchAllRows((from, to) =>
            supabase
              .from("bookings")
              .select("id, operator_name, trade_name, route, plate_no, booking_date, slot")
              .eq("status", "pending")
              .range(from, to)
          ),
          supabase
            .from("vehicles")
            .select("id", { count: "exact", head: true })
            .eq("status", "pending"),
          supabase
            .from("booking_transfers")
            .select("id", { count: "exact", head: true })
            .eq("status", "pending")
            .eq("recipient_response", "accepted"),
          supabase
            .from("booking_transfers")
            .select("id", { count: "exact", head: true })
            .eq("status", "pending")
            .eq("recipient_response", "pending"),
          supabase
            .from("bookings")
            .select("id", { count: "exact", head: true })
            .eq("status", "approved")
            .eq("booking_date", today),
        ]);

        const pendingBookings = pendingBookingsRes.data ?? [];

        renderKpis({
          pendingCount: pendingBookings.length,
          pendingVehicles: pendingVehiclesRes.count ?? 0,
          transfersAwaitingStaff: transfersAwaitingStaffRes.count ?? 0,
          transfersAwaitingOperator: transfersAwaitingOperatorRes.count ?? 0,
          approvedToday: approvedTodayRes.count ?? 0,
          today,
        });

        renderLockout(pendingBookings);
      }

      function renderKpis({
        pendingCount,
        pendingVehicles,
        transfersAwaitingStaff,
        transfersAwaitingOperator,
        approvedToday,
        today,
      }) {
        const tiles = [
          {
            label: "Pending requests",
            value: pendingCount,
            unit: "requests",
            href: "staff.html",
          },
          {
            label: "Vehicle approvals",
            value: pendingVehicles,
            unit: "vehicles",
            href: "vehicle-approvals.html",
          },
          {
            label: "Transfers awaiting you",
            value: transfersAwaitingStaff,
            unit: "transfers",
            href: "transfer-approvals.html",
          },
          {
            label: "Transfers awaiting operator",
            value: transfersAwaitingOperator,
            unit: "transfers",
            href: "transfer-approvals.html",
          },
          {
            label: "Approved today",
            value: approvedToday,
            unit: "buses",
            href: `schedule.html?date=${encodeURIComponent(today)}`,
          },
        ];

        document.getElementById("kpis").innerHTML = tiles
          .map(
            (k) => `
            <a class="kpi-link" href="${escapeHtml(k.href)}">
              <div class="kpi">
                <div class="kpi-label">${escapeHtml(k.label)}</div>
                <div class="kpi-value">
                  <strong>${k.value}</strong><span>${escapeHtml(k.unit)}</span>
                </div>
              </div>
            </a>`
          )
          .join("");
      }

      function renderLockout(pendingBookings) {
        const now = Date.now();
        const urgent = pendingBookings
          .map((b) => {
            const timeToSlot = slotStartMillis(b.booking_date, b.slot) - now;
            // Not "time until the slot starts" - time until this request
            // hits the booking lockout and can no longer be changed at
            // all. A request 2h50m from its slot is 50m from that
            // deadline, not "50m away" itself - subtracting the lockout
            // window is what turns "time to slot" into "time to act".
            return { ...b, remainingMs: timeToSlot - BOOKING_LEAD_TIME_MS };
          })
          // Not yet locked out (still approvable) and inside the urgent
          // half of the window before it becomes un-approvable.
          .filter((b) => b.remainingMs >= 0 && b.remainingMs <= URGENT_WINDOW_MS)
          .sort((a, b) => a.remainingMs - b.remainingMs);

        const host = document.getElementById("lockout");

        if (urgent.length === 0) {
          host.innerHTML = `
            <div class="lockout-card is-calm">
              <p class="lockout-title">Nothing approaching lockout</p>
              <p class="subtle" style="margin: 0">
                No pending requests are within ${URGENT_HOURS}
                hour${plural(URGENT_HOURS)} of their ${LOCKOUT_HOURS}-hour
                booking-lockout window.
              </p>
            </div>
          `;
          return;
        }

        host.innerHTML = `
          <div class="lockout-card is-urgent">
            <p class="lockout-title">
              ${urgent.length} pending request${urgent.length === 1 ? "" : "s"}
              approaching lockout
            </p>
            <ul class="lockout-list">
              ${urgent
                .map((b) => {
                  const hoursLeft = (b.remainingMs / 3600000).toFixed(1);
                  return `
                    <li>
                      <span>
                        ${bookingOperatorHtml(b)} &middot; ${escapeHtml(
                          b.route
                        )} &middot; ${escapeHtml(b.plate_no)}
                        &middot; ${escapeHtml(b.booking_date)} ${escapeHtml(
                          formatSlotStart(b.slot)
                        )}
                        &middot; ${hoursLeft}h left
                      </span>
                      <a href="staff.html">Review &rarr;</a>
                    </li>
                  `;
                })
                .join("")}
            </ul>
          </div>
        `;
      }

      function renderQuickLinks() {
        const links = [
          { href: "staff.html", label: "Pending requests" },
          { href: "vehicle-approvals.html", label: "Vehicle approvals" },
          { href: "vehicles-database.html", label: "Vehicles" },
          { href: "transfer-approvals.html", label: "Transfer approvals" },
          { href: "schedule.html", label: "Schedule" },
          { href: "utilization.html", label: "Utilization" },
          { href: "bays.html", label: "Bays" },
          { href: "operator-profiles.html", label: "Operator profiles" },
          { href: "accounts.html", label: "Accounts" },
        ];

        document.getElementById("quick-links").innerHTML = links
          .map(
            (l) =>
              `<a class="quick-link" href="${escapeHtml(l.href)}">${escapeHtml(
                l.label
              )}</a>`
          )
          .join("");
      }
    </script>
  </body>
</html>
