<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Operator profiles · PITX Trip Scheduling</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="nav" id="nav"></header>

    <main class="wrap">
      <div class="page-head">
        <div>
          <p class="eyebrow">Transport Operations &middot; Company Details</p>
          <h1>Operator profiles</h1>
          <p class="subtle">
            Read-only view of each operator account's company details, from
            the top of the PITX/MWM Terminals registration form. Operators
            edit their own on <strong>Operator profile</strong> - no
            approval step, so what's shown here is always current.
          </p>
        </div>
        <div>
          <p class="subtle" id="summary-count"></p>
          <button type="button" class="btn-outline" id="export-csv">Export CSV</button>
        </div>
      </div>

      <div class="toolbar" style="justify-content: space-between; margin-bottom: 20px">
        <div class="field" style="max-width: 360px; margin-bottom: 0">
          <label for="search">Search</label>
          <input
            id="search"
            placeholder="Username, operator, or company name…"
          />
        </div>
        <div class="mode-switch" role="tablist" id="profile-filter">
          <button type="button" class="mode-tab is-active" data-filter="all">All</button>
          <button type="button" class="mode-tab" data-filter="missing">Missing profile</button>
        </div>
      </div>

      <div class="hidden" id="message"></div>
      <div id="list"></div>
    </main>

    <script type="module">
      import {
        supabase,
        guardPage,
        renderNav,
        showMessage,
        escapeHtml,
        downloadCsv,
      } from "./assets/app.js";

      const profile = await guardPage("staff");
      if (!profile) throw new Error("unauthorised");
      renderNav(profile);

      let rows = [];
      let profileFilter = "all";
      let sortKey = null;
      let sortDir = "asc";
      // The exact filtered/sorted set currently on screen - shared between
      // render() and exportCsv() so the CSV always matches what's visible.
      // Must be declared up here, before the `await load()` a few lines
      // down - load() -> render() reads this at module top-level, which
      // would otherwise run while this `let` is still in its temporal
      // dead zone (same class of bug as #37/#39/#46/#52/#66).
      let lastVisibleRows = [];

      // Operator (display name/username) and Company are sortable - click
      // a header to sort by it, click again to flip direction. Everything
      // else here is free text with no natural sort order worth adding.
      const SORT_VALUE = {
        operator: (r) => (r.operator_name || r.username)?.toUpperCase() ?? null,
        company: (r) => r.companyProfile?.company_name?.toUpperCase() ?? null,
      };

      function sortTh(label, key) {
        const active = sortKey === key;
        const arrow = active ? (sortDir === "asc" ? " &#9650;" : " &#9660;") : "";
        return `<th class="sortable" data-sort="${key}">${escapeHtml(label)}${arrow}</th>`;
      }

      function applySort(list) {
        if (!sortKey) return list;
        const getValue = SORT_VALUE[sortKey];
        const dir = sortDir === "asc" ? 1 : -1;
        return [...list].sort((a, b) => {
          const av = getValue(a);
          const bv = getValue(b);
          if (av == null && bv == null) return 0;
          if (av == null) return 1;
          if (bv == null) return -1;
          if (av < bv) return -1 * dir;
          if (av > bv) return 1 * dir;
          return 0;
        });
      }

      document.getElementById("search").addEventListener("input", render);
      document.querySelectorAll("#profile-filter [data-filter]").forEach((btn) => {
        btn.addEventListener("click", () => {
          profileFilter = btn.dataset.filter;
          document
            .querySelectorAll("#profile-filter [data-filter]")
            .forEach((b) => b.classList.toggle("is-active", b === btn));
          render();
        });
      });
      document.getElementById("export-csv").addEventListener("click", exportCsv);
      await load();

      // A contact's plain-text one-liner ("Name (Position) · Number ·
      // Email"), used by both the table cell and the CSV export so the
      // two always agree. `contacts` is the new JSONB array
      // (migration 0037) - up to 5 entries, replacing the old fixed
      // contact1_*/contact2_* column pairs.
      function contactLine(c) {
        if (!c?.name) return "";
        return [
          c.position ? `${c.name} (${c.position})` : c.name,
          c.number || null,
          c.email || null,
        ]
          .filter(Boolean)
          .join(" · ");
      }

      function exportCsv() {
        downloadCsv(
          "operator-profiles.csv",
          [
            "Operator", "Username", "Company", "Trade Name", "Operator/Trade Code",
            "Owner", "Booking system", "Contacts",
          ],
          currentRows().map((r) => {
            const p = r.companyProfile;
            const contactsText = (p?.contacts ?? [])
              .map(contactLine)
              .filter(Boolean)
              .join("; ");
            return [
              r.operator_name || r.username,
              r.username,
              p?.company_name ?? "",
              p?.trade_name ?? "",
              p?.operator_code ?? "",
              p?.company_owner ?? "",
              !p ? "" : p.has_booking_system ? p.booking_system_name || "Yes" : "No",
              contactsText,
            ];
          })
        );
      }

      function currentRows() {
        return lastVisibleRows;
      }

      async function load() {
        // Every operator account, not just the ones that have saved a
        // profile - staff need to see who *hasn't* submitted one yet, not
        // just the ones who have.
        const [{ data: operators, error: opError }, { data: profiles, error: profError }] =
          await Promise.all([
            supabase
              .from("profiles")
              .select("id, username, operator_name")
              .eq("role", "operator")
              .order("operator_name", { ascending: true, nullsFirst: false })
              .order("username", { ascending: true })
              .range(0, 4999),
            supabase.from("operator_profiles").select("*").range(0, 4999),
          ]);

        if (opError || profError) {
          showMessage("message", (opError ?? profError).message);
          return;
        }

        const byOperatorId = new Map((profiles ?? []).map((p) => [p.operator_id, p]));
        rows = (operators ?? []).map((o) => ({
          ...o,
          companyProfile: byOperatorId.get(o.id) ?? null,
        }));

        render();
      }

      function render() {
        const query = document.getElementById("search").value.trim().toLowerCase();
        let filtered = query
          ? rows.filter((r) =>
              [r.username, r.operator_name, r.companyProfile?.company_name]
                .filter(Boolean)
                .some((v) => v.toLowerCase().includes(query))
            )
          : rows;
        if (profileFilter === "missing") {
          filtered = filtered.filter((r) => !r.companyProfile);
        }
        filtered = applySort(filtered);
        lastVisibleRows = filtered;

        const withProfile = rows.filter((r) => r.companyProfile).length;
        document.getElementById("summary-count").textContent =
          `${withProfile} of ${rows.length} operators have submitted a profile`;

        const host = document.getElementById("list");

        if (filtered.length === 0) {
          host.innerHTML = `<p class="empty">${
            rows.length === 0 ? "No operator accounts yet." : "No matches."
          }</p>`;
          return;
        }

        host.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  ${sortTh("Operator", "operator")}<th>Username</th>${sortTh("Company", "company")}
                  <th>Trade Name</th><th>Operator/Trade Code</th><th>Logo</th>
                  <th>Owner</th>
                  <th>Booking system</th>
                  <th>Contacts</th>
                </tr>
              </thead>
              <tbody>
                ${filtered
                  .map((r) => {
                    const p = r.companyProfile;
                    const label = r.operator_name || r.username;
                    return `
                  <tr>
                    <td class="cell-strong" data-label="Operator">${escapeHtml(label)}${
                      p
                        ? ""
                        : `<span class="badge badge-pending" style="margin-left: 8px">no profile yet</span>`
                    }</td>
                    <td data-label="Username">@${escapeHtml(r.username)}</td>
                    <td data-label="Company">${escapeHtml(p?.company_name || "—")}</td>
                    <td data-label="Trade Name">${escapeHtml(p?.trade_name || "—")}</td>
                    <td data-label="Operator/Trade Code">${escapeHtml(p?.operator_code || "—")}</td>
                    <td data-label="Logo" data-logo-path="${escapeHtml(p?.logo_path ?? "")}">${
                      p?.logo_path ? "&hellip;" : "—"
                    }</td>
                    <td data-label="Owner">${escapeHtml(p?.company_owner || "—")}</td>
                    <td data-label="Booking system">${
                      !p
                        ? "—"
                        : p.has_booking_system
                          ? escapeHtml(p.booking_system_name || "Yes")
                          : "No"
                    }</td>
                    <td data-label="Contacts">${
                      (p?.contacts ?? []).length
                        ? p.contacts
                            .map((c) => escapeHtml(contactLine(c)))
                            .filter(Boolean)
                            .join("<br />")
                        : "—"
                    }</td>
                  </tr>`;
                  })
                  .join("")}
              </tbody>
            </table>
          </div>
        `;

        host.querySelectorAll("[data-sort]").forEach((th) => {
          th.addEventListener("click", () => {
            const key = th.dataset.sort;
            sortDir = sortKey === key && sortDir === "asc" ? "desc" : "asc";
            sortKey = key;
            render();
          });
        });

        resolveLogoLinks();
      }

      // Signed URLs are resolved after the table paints (rather than
      // blocking the initial render on every row's storage round-trip),
      // same pattern as vehicles-database.html's document links.
      async function resolveLogoLinks() {
        const cells = [...document.querySelectorAll("[data-logo-path]")].filter(
          (cell) => cell.dataset.logoPath
        );
        await Promise.all(
          cells.map(async (cell) => {
            const { data } = await supabase.storage
              .from("operator-docs")
              .createSignedUrl(cell.dataset.logoPath, 300);
            cell.innerHTML = data?.signedUrl
              ? `<a href="${data.signedUrl}" target="_blank" rel="noopener">View logo</a>`
              : "—";
          })
        );
      }
    </script>
  </body>
</html>
