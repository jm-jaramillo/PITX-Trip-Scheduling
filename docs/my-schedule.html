<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My schedule · PITX Bus Bay Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="nav" id="nav"></header>

    <main class="wrap">
      <div class="page-head">
        <div>
          <p class="eyebrow">Provincial Slot Booking</p>
          <h1>My schedule</h1>
          <p class="subtle">
            Your approved slots and the bay assigned to each, in order.
            Pending and declined requests aren't shown here - see
            <a href="dashboard.html">My requests</a> for those.
          </p>
        </div>
        <div class="mode-switch" role="tablist" id="range-filter">
          <button type="button" class="mode-tab is-active" data-range="upcoming">Upcoming</button>
          <button type="button" class="mode-tab" data-range="all">All</button>
        </div>
      </div>

      <div id="schedule"></div>
    </main>

    <script type="module">
      import {
        supabase,
        guardPage,
        renderNav,
        formatSlot,
        todayISO,
        escapeHtml,
      } from "./assets/app.js";

      const profile = await guardPage("operator");
      if (!profile) throw new Error("unauthorised");
      renderNav(profile);

      let allApproved = [];
      let range = "upcoming";

      initRangeFilter();
      await load();

      function initRangeFilter() {
        document.querySelectorAll("#range-filter [data-range]").forEach((btn) => {
          btn.addEventListener("click", () => {
            range = btn.dataset.range;
            document
              .querySelectorAll("#range-filter [data-range]")
              .forEach((b) => b.classList.toggle("is-active", b === btn));
            render();
          });
        });
      }

      async function load() {
        // Only approved bookings have a bay assigned - pending/declined
        // ones already show elsewhere (My requests), so this page stays
        // focused on "where do I actually need to show up".
        const { data, error } = await supabase
          .from("bookings")
          .select(
            "id, operator_name, previous_operator_name, route, plate_no, booking_date, slot, bays ( id, name )"
          )
          .eq("operator_id", profile.id)
          .eq("status", "approved")
          .order("booking_date", { ascending: false })
          .order("slot", { ascending: true });

        if (error) {
          document.getElementById("schedule").innerHTML =
            `<p class="empty">Couldn't load your schedule: ${escapeHtml(error.message)}</p>`;
          return;
        }

        allApproved = data ?? [];
        render();
      }

      function formatDateHeading(iso) {
        const [y, m, d] = iso.split("-").map(Number);
        // Noon avoids any timezone edge landing on the wrong calendar day.
        const date = new Date(y, m - 1, d, 12);
        return date.toLocaleDateString(undefined, {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric",
        });
      }

      function render() {
        const today = todayISO();
        const rows =
          range === "upcoming"
            ? allApproved.filter((b) => b.booking_date >= today)
            : allApproved;

        const host = document.getElementById("schedule");

        if (rows.length === 0) {
          host.innerHTML = `<p class="empty">${
            range === "upcoming"
              ? "No upcoming approved slots."
              : "No approved slots yet."
          }</p>`;
          return;
        }

        // One group per calendar date, each rendered as its own vertical
        // timeline - a booking list reads better chronologically grouped
        // by day than as one flat table.
        const byDate = new Map();
        for (const b of rows) {
          if (!byDate.has(b.booking_date)) byDate.set(b.booking_date, []);
          byDate.get(b.booking_date).push(b);
        }

        host.innerHTML = [...byDate.entries()]
          .map(([date, bookings]) => {
            const isPast = date < today;
            return `
              <section class="tl-day${isPast ? " tl-day-past" : ""}">
                <h2 class="tl-day-heading">
                  ${escapeHtml(formatDateHeading(date))}
                  ${date === today ? '<span class="tl-today-tag">Today</span>' : ""}
                </h2>
                <div class="timeline">
                  ${bookings
                    .map(
                      (b) => `
                    <div class="timeline-item">
                      <div class="timeline-rail">
                        <span class="timeline-dot"></span>
                        <span class="timeline-line"></span>
                      </div>
                      <div class="timeline-card">
                        <div class="timeline-time">${escapeHtml(formatSlot(b.slot))}</div>
                        <div class="timeline-main">
                          <span class="bay-tag">${escapeHtml(b.bays?.name ?? "No bay")}</span>
                          <span class="timeline-route">${escapeHtml(b.route)}</span>
                          <span class="timeline-plate">${escapeHtml(b.plate_no)}</span>
                        </div>
                        ${
                          b.previous_operator_name
                            ? `<div class="subtle">
                                <s class="transferred-from">${escapeHtml(
                                  b.previous_operator_name
                                )}</s> ${escapeHtml(b.operator_name)}
                              </div>`
                            : ""
                        }
                      </div>
                    </div>`
                    )
                    .join("")}
                </div>
              </section>`;
          })
          .join("");
      }
    </script>
  </body>
</html>
