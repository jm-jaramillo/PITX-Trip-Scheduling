<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My schedule · PITX Bus Bay Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="nav" id="nav"></header>

    <main class="wrap">
      <div class="page-head">
        <div>
          <p class="eyebrow">Provincial Slot Booking</p>
          <h1>My schedule</h1>
          <p class="subtle">
            Your approved slots and the bay assigned to each, in order.
            Pending and declined requests aren't shown here - see
            <a href="dashboard.html">My requests</a> for those.
          </p>
        </div>
        <div class="toolbar">
          <div class="mode-switch" role="tablist" id="view-mode">
            <button type="button" class="mode-tab" data-view="day">Day</button>
            <button type="button" class="mode-tab is-active" data-view="week">Week</button>
          </div>
          <button type="button" class="btn-outline" id="prev">&larr; Prev</button>
          <input type="date" id="date" />
          <button type="button" class="btn-outline" id="next">Next &rarr;</button>
          <button type="button" class="btn-outline" id="export-csv">Export CSV</button>
        </div>
      </div>

      <div id="schedule"></div>
    </main>

    <script type="module">
      import {
        supabase,
        guardPage,
        renderNav,
        SLOTS,
        formatSlot,
        todayISO,
        addDays,
        weekDates,
        escapeHtml,
        downloadCsv,
      } from "./assets/app.js";

      const profile = await guardPage("operator");
      if (!profile) throw new Error("unauthorised");
      renderNav(profile);

      const dateInput = document.getElementById("date");
      const fromQuery = new URLSearchParams(location.search).get("date");
      let currentDate = /^\d{4}-\d{2}-\d{2}$/.test(fromQuery ?? "")
        ? fromQuery
        : todayISO();
      dateInput.value = currentDate;

      // Week is the default - closest to the old "Upcoming" view, showing
      // a whole week (including empty days) rather than one date at a
      // time. Day zooms into a single date; both share the same
      // prev/next navigation, just at different step sizes.
      let viewMode = "week";
      document.querySelectorAll("#view-mode [data-view]").forEach((btn) => {
        btn.addEventListener("click", () => {
          viewMode = btn.dataset.view;
          document
            .querySelectorAll("#view-mode [data-view]")
            .forEach((b) => b.classList.toggle("is-active", b === btn));
          document.getElementById("prev").textContent =
            viewMode === "week" ? "← Prev week" : "← Prev day";
          document.getElementById("next").textContent =
            viewMode === "week" ? "Next week →" : "Next day →";
          load();
        });
      });
      document.getElementById("prev").textContent = "← Prev week";
      document.getElementById("next").textContent = "Next week →";

      dateInput.addEventListener("change", () => {
        if (dateInput.value) {
          currentDate = dateInput.value;
          load();
        }
      });
      document.getElementById("prev").addEventListener("click", () => {
        currentDate = addDays(currentDate, viewMode === "week" ? -7 : -1);
        dateInput.value = currentDate;
        load();
      });
      document.getElementById("next").addEventListener("click", () => {
        currentDate = addDays(currentDate, viewMode === "week" ? 7 : 1);
        dateInput.value = currentDate;
        load();
      });

      document.getElementById("export-csv").addEventListener("click", () => {
        if (viewMode === "week") {
          exportWeekCsv();
        } else {
          exportDayCsv();
        }
      });

      // Retained from the most recent load() call so the Export CSV
      // button can reuse the already-fetched bookings instead of
      // refetching from Supabase just for the export.
      let lastDayBookings = [];
      let lastWeekBookings = [];

      const CSV_HEADERS = [
        "Date",
        "Time slot",
        "Route",
        "Plate No.",
        "Bay",
        "Trip No.",
      ];

      function bookingToCsvRow(b) {
        return [
          b.booking_date ?? currentDate,
          formatSlot(b.slot),
          b.route ?? "",
          b.plate_no ?? "",
          b.bays?.name ?? "",
          b.trip_number ?? "",
        ];
      }

      function exportDayCsv() {
        const rows = [...lastDayBookings]
          .sort((a, b) => a.slot - b.slot)
          .map(bookingToCsvRow);
        downloadCsv(`my-schedule-${currentDate}.csv`, CSV_HEADERS, rows);
      }

      function exportWeekCsv() {
        const days = weekDates(currentDate);
        const rows = [...lastWeekBookings]
          .sort(
            (a, b) =>
              a.booking_date.localeCompare(b.booking_date) || a.slot - b.slot
          )
          .map(bookingToCsvRow);
        downloadCsv(
          `my-schedule-week-${days[0]}-to-${days[6]}.csv`,
          CSV_HEADERS,
          rows
        );
      }

      await load();

      async function load() {
        const days = viewMode === "week" ? weekDates(currentDate) : [currentDate];

        // Only approved bookings have a bay assigned - pending/declined
        // ones already show elsewhere (My requests), so this page stays
        // focused on "where do I actually need to show up".
        const { data, error } = await supabase
          .from("bookings")
          .select(
            "id, operator_name, previous_operator_name, route, plate_no, booking_date, slot, trip_number, bays ( id, name )"
          )
          .eq("operator_id", profile.id)
          .eq("status", "approved")
          .gte("booking_date", days[0])
          .lte("booking_date", days[days.length - 1])
          .order("booking_date", { ascending: true })
          .order("slot", { ascending: true });

        if (error) {
          document.getElementById("schedule").innerHTML =
            `<p class="empty">Couldn't load your schedule: ${escapeHtml(error.message)}</p>`;
          return;
        }

        if (viewMode === "week") {
          lastWeekBookings = data ?? [];
          renderWeekGrid(days, data ?? []);
        } else {
          lastDayBookings = data ?? [];
          render(days, data ?? []);
        }
      }

      function formatDateHeading(iso) {
        const [y, m, d] = iso.split("-").map(Number);
        // Noon avoids any timezone edge landing on the wrong calendar day.
        const date = new Date(y, m - 1, d, 12);
        return date.toLocaleDateString(undefined, {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric",
        });
      }

      function formatDayHeading(iso) {
        const [y, m, d] = iso.split("-").map(Number);
        const date = new Date(y, m - 1, d, 12);
        return date.toLocaleDateString(undefined, {
          weekday: "short",
          month: "short",
          day: "numeric",
        });
      }

      // Week view as a grid - dates across the top, time slots down the
      // side, matching the staff schedule's Week grid (docs/schedule.html)
      // so the same date/time axes read the same way for both roles.
      // Most cells are empty (an operator typically has only a handful
      // of approved bookings across a whole week's 336 slots) - each
      // populated cell shows the bay, route, and plate for that slot.
      function renderWeekGrid(days, bookings) {
        const today = todayISO();
        const host = document.getElementById("schedule");

        const byDateSlot = new Map(days.map((d) => [d, new Map()]));
        for (const b of bookings) {
          byDateSlot.get(b.booking_date)?.set(b.slot, b);
        }

        const gridHtml = `
          <div class="table-wrap">
            <table class="week-grid">
              <thead>
                <tr>
                  <th>Time slot</th>
                  ${days
                    .map(
                      (date) => `
                    <th${date === today ? ' class="week-today"' : ""}>
                      ${escapeHtml(formatDayHeading(date))}
                      ${date === today ? '<span class="tl-today-tag">Today</span>' : ""}
                    </th>`
                    )
                    .join("")}
                </tr>
              </thead>
              <tbody>
                ${SLOTS.map((slot) => {
                  return `
                    <tr>
                      <td class="hour-cell" data-label="Time slot">${escapeHtml(formatSlot(slot))}</td>
                      ${days
                        .map((date) => {
                          const b = byDateSlot.get(date).get(slot);
                          return `
                        <td class="${date === today ? "week-today" : ""}" data-label="${escapeHtml(
                            formatDayHeading(date)
                          )}">
                          ${
                            b
                              ? `<span class="bay-tag">${escapeHtml(
                                  b.bays?.name ?? "No bay"
                                )}</span> <span class="timeline-route">${escapeHtml(
                                  b.route
                                )}</span> <span class="timeline-plate">${escapeHtml(b.plate_no)}</span>${
                                  b.trip_number
                                    ? ` <span class="trip-tag">${escapeHtml(b.trip_number)}</span>`
                                    : ""
                                }`
                              : '<span class="muted">—</span>'
                          }
                        </td>`;
                        })
                        .join("")}
                    </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;

        // Condensed agenda alternative for narrow viewports - the same
        // 48-row x 7-column grid above is unusable on a phone (very tall,
        // needs both scroll directions), so this groups the same week's
        // bookings by date instead, one line per populated slot and empty
        // days collapsed to a single "no bookings" line. Both markups are
        // rendered up front; CSS (see styles.css) picks which one shows
        // based on viewport width, so there's no separate fetch/render
        // path to keep in sync.
        const agendaHtml = days
          .map((date) => {
            const bySlot = byDateSlot.get(date);
            const rows = SLOTS.filter((slot) => bySlot.has(slot)).map(
              (slot) => bySlot.get(slot)
            );
            return `
              <section class="tl-day">
                <h2 class="tl-day-heading">
                  ${escapeHtml(formatDayHeading(date))}
                  ${date === today ? '<span class="tl-today-tag">Today</span>' : ""}
                </h2>
                ${
                  rows.length === 0
                    ? `<p class="empty">No approved slots.</p>`
                    : `<div class="timeline">
                        ${rows
                          .map(
                            (b) => `
                          <div class="timeline-item">
                            <div class="timeline-rail">
                              <span class="timeline-dot"></span>
                              <span class="timeline-line"></span>
                            </div>
                            <div class="timeline-card">
                              <div class="timeline-time">${escapeHtml(formatSlot(b.slot))}</div>
                              <div class="timeline-main">
                                <span class="bay-tag">${escapeHtml(b.bays?.name ?? "No bay")}</span>
                                <span class="timeline-route">${escapeHtml(b.route)}</span>
                                <span class="timeline-plate">${escapeHtml(b.plate_no)}</span>
                                ${
                                  b.trip_number
                                    ? `<span class="trip-tag">${escapeHtml(b.trip_number)}</span>`
                                    : ""
                                }
                              </div>
                            </div>
                          </div>`
                          )
                          .join("")}
                      </div>`
                }
              </section>`;
          })
          .join("");

        host.innerHTML = `
          <div id="week-grid-wrap">${gridHtml}</div>
          <div id="week-agenda-wrap">${agendaHtml}</div>
        `;
      }

      // `days` is every date the current view should show (a single date
      // in Day mode, 7 in Week mode) - always rendered, even with zero
      // bookings, so the shape of the range is visible rather than
      // silently collapsing empty days out of the list.
      function render(days, bookings) {
        const today = todayISO();
        const host = document.getElementById("schedule");

        const byDate = new Map(days.map((d) => [d, []]));
        for (const b of bookings) {
          byDate.get(b.booking_date)?.push(b);
        }

        host.innerHTML = days
          .map((date) => {
            const rows = byDate.get(date) ?? [];
            const isPast = date < today;
            return `
              <section class="tl-day${isPast ? " tl-day-past" : ""}">
                <h2 class="tl-day-heading">
                  ${escapeHtml(formatDateHeading(date))}
                  ${date === today ? '<span class="tl-today-tag">Today</span>' : ""}
                </h2>
                ${
                  rows.length === 0
                    ? `<p class="empty">No approved slots.</p>`
                    : `<div class="timeline">
                        ${rows
                          .map(
                            (b) => `
                          <div class="timeline-item">
                            <div class="timeline-rail">
                              <span class="timeline-dot"></span>
                              <span class="timeline-line"></span>
                            </div>
                            <div class="timeline-card">
                              <div class="timeline-time">${escapeHtml(formatSlot(b.slot))}</div>
                              <div class="timeline-main">
                                <span class="bay-tag">${escapeHtml(b.bays?.name ?? "No bay")}</span>
                                <span class="timeline-route">${escapeHtml(b.route)}</span>
                                <span class="timeline-plate">${escapeHtml(b.plate_no)}</span>
                                ${
                                  b.trip_number
                                    ? `<span class="trip-tag">${escapeHtml(b.trip_number)}</span>`
                                    : ""
                                }
                              </div>
                              ${
                                b.previous_operator_name
                                  ? `<div class="subtle">
                                      <s class="transferred-from">${escapeHtml(
                                        b.previous_operator_name
                                      )}</s> ${escapeHtml(b.operator_name)}
                                    </div>`
                                  : ""
                              }
                            </div>
                          </div>`
                          )
                          .join("")}
                      </div>`
                }
              </section>`;
          })
          .join("");
      }
    </script>
  </body>
</html>
