<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pending requests · PITX Bus Bay Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="nav" id="nav"></header>

    <main class="wrap">
      <div class="page-head">
        <div>
          <p class="eyebrow">Transport Operations &middot; Slot Approvals</p>
          <h1>Pending requests</h1>
          <p class="subtle">
            Approve a request by assigning it a bay, or reject it with an
            optional note back to the operator.
          </p>
        </div>
        <p class="subtle" id="queue-count"></p>
      </div>

      <div class="hidden" id="message"></div>
      <div id="requests"></div>
    </main>

    <script type="module">
      import {
        supabase,
        guardPage,
        renderNav,
        formatSlot,
        compareBayNames,
        gateForRoute,
        showMessage,
        escapeHtml,
      } from "./assets/app.js";

      const profile = await guardPage("staff");
      if (profile) {
        renderNav(profile);
        await load();
      }

      async function load() {
        const [pendingRes, baysRes, approvedRes] = await Promise.all([
          supabase
            .from("bookings")
            .select(
              "id, operator_name, route, plate_no, booking_date, slot, status, revision_count, previously_approved, last_edited_at"
            )
            .eq("status", "pending")
            .order("booking_date", { ascending: true })
            .order("slot", { ascending: true }),
          supabase
            .from("bays")
            .select("id, name, gate")
            .eq("is_active", true),
          supabase
            .from("bookings")
            .select("booking_date, slot, assigned_bay_id")
            .eq("status", "approved"),
        ]);

        const requests = pendingRes.data ?? [];
        const bays = (baysRes.data ?? []).sort((a, b) =>
          compareBayNames(a.name, b.name)
        );

        // Which bays are already committed for a given date+slot.
        const taken = new Map();
        for (const row of approvedRes.data ?? []) {
          const key = `${row.booking_date}|${row.slot}`;
          if (!taken.has(key)) taken.set(key, new Set());
          if (row.assigned_bay_id) taken.get(key).add(row.assigned_bay_id);
        }

        const host = document.getElementById("requests");

        document.getElementById("queue-count").textContent =
          requests.length === 0
            ? "Queue clear"
            : `${requests.length} awaiting review`;

        if (requests.length === 0) {
          host.innerHTML = `<p class="empty">No pending requests right now.</p>`;
          return;
        }

        host.innerHTML = requests
          .map((b) => {
            const takenIds = taken.get(`${b.booking_date}|${b.slot}`) ?? new Set();
            const available = bays.filter((bay) => !takenIds.has(bay.id));
            const none = available.length === 0;

            // Bays at the gate this route is meant to use come first, as
            // a separate optgroup - staff can still pick from "Other
            // bays" if that gate is full or the route has no gate rule.
            const gate = gateForRoute(b.route);
            const suggested = gate ? available.filter((bay) => bay.gate === gate) : [];
            const other = gate ? available.filter((bay) => bay.gate !== gate) : available;

            const optionsHtml = (list) =>
              list
                .map(
                  (bay) =>
                    `<option value="${bay.id}">${escapeHtml(bay.name)}</option>`
                )
                .join("");

            return `
              <div class="request-card">
                <div class="request-head">
                  <div>
                    <p class="request-who">${escapeHtml(
                      b.operator_name
                    )} &middot; ${escapeHtml(b.plate_no)}${
                      // Flags a slot the operator already held: approving
                      // re-confirms it, rejecting leaves them with nothing.
                      b.previously_approved
                        ? `<span class="revised">changed after approval</span>`
                        : b.revision_count > 0
                          ? `<span class="revised">changed &times;${b.revision_count}</span>`
                          : ""
                    }</p>
                    <p class="subtle">${escapeHtml(b.route)}${
                      gate ? ` &middot; ${escapeHtml(gate)}` : ""
                    }</p>
                  </div>
                  <p class="request-when">${escapeHtml(
                    b.booking_date
                  )} &middot; ${escapeHtml(formatSlot(b.slot))}</p>
                </div>
                <div class="request-actions">
                  <form data-approve="${escapeHtml(b.id)}">
                    <select required ${none ? "disabled" : ""}>
                      <option value="" disabled selected>${
                        none ? "No bays available" : "Assign bay…"
                      }</option>
                      ${
                        suggested.length
                          ? `<optgroup label="Suggested (${escapeHtml(gate)})">${optionsHtml(
                              suggested
                            )}</optgroup>`
                          : ""
                      }
                      ${
                        other.length
                          ? `<optgroup label="${suggested.length ? "Other bays" : "Bays"}">${optionsHtml(
                              other
                            )}</optgroup>`
                          : ""
                      }
                    </select>
                    <button type="submit" class="btn-approve" ${
                      none ? "disabled" : ""
                    }>Approve</button>
                  </form>
                  <form data-reject="${escapeHtml(b.id)}">
                    <input placeholder="Reason (optional)" />
                    <button type="submit" class="btn-danger-outline">Reject</button>
                  </form>
                </div>
              </div>
            `;
          })
          .join("");

        host.querySelectorAll("[data-approve]").forEach((form) => {
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            approve(form.dataset.approve, form.querySelector("select").value);
          });
        });

        host.querySelectorAll("[data-reject]").forEach((form) => {
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            reject(form.dataset.reject, form.querySelector("input").value.trim());
          });
        });
      }

      async function approve(bookingId, bayIdRaw) {
        showMessage("message", "");
        if (!bayIdRaw) {
          return showMessage("message", "Please choose a bay before approving.");
        }

        const { data, error } = await supabase
          .from("bookings")
          .update({
            status: "approved",
            assigned_bay_id: Number(bayIdRaw),
            decided_by: profile.id,
            decided_at: new Date().toISOString(),
          })
          .eq("id", bookingId)
          .eq("status", "pending")
          .select("id");

        if (error) {
          // 23505 = unique violation on the approved bay/slot index.
          showMessage(
            "message",
            error.code === "23505"
              ? "That bay was just taken for this slot by another request. Pick a different bay."
              : error.message
          );
          return;
        }
        if (!data || data.length === 0) {
          showMessage("message", "That request was already decided on.");
        }
        await load();
      }

      async function reject(bookingId, reason) {
        showMessage("message", "");
        await supabase
          .from("bookings")
          .update({
            status: "rejected",
            rejection_reason: reason || null,
            decided_by: profile.id,
            decided_at: new Date().toISOString(),
          })
          .eq("id", bookingId)
          .eq("status", "pending");
        await load();
      }
    </script>
  </body>
</html>
