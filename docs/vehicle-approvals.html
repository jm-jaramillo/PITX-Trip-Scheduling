<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vehicle approvals · PITX Bus Bay Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="nav" id="nav"></header>

    <main class="wrap">
      <div class="page-head">
        <div>
          <p class="eyebrow">Transport Operations &middot; Fleet Approvals</p>
          <h1>Vehicle approvals</h1>
          <p class="subtle">
            Approve a vehicle so it appears in the operator's booking-form
            plate list, or reject it with an optional note.
          </p>
        </div>
        <p class="subtle" id="queue-count"></p>
      </div>

      <div class="hidden" id="message"></div>
      <div id="requests"></div>
    </main>

    <script type="module">
      import {
        supabase,
        guardPage,
        renderNav,
        showMessage,
        escapeHtml,
      } from "./assets/app.js";

      const profile = await guardPage("staff");
      if (!profile) throw new Error("unauthorised");
      renderNav(profile);

      await load();

      function airconLabel(aircon) {
        if (aircon === true) return "Aircon";
        if (aircon === false) return "Non-aircon";
        return "—";
      }

      async function load() {
        const { data, error } = await supabase
          .from("vehicles")
          .select(
            // vehicles has two FKs into profiles (operator_id, decided_by),
            // so the embed needs the constraint name to disambiguate which.
            "id, operator_id, plate_no, case_number, mv_file_number, or_number, cr_number, route, bus_number, seating_capacity, seat_type, aircon, date_granted, date_expiry, source, photo_path, supporting_doc_path, supporting_doc_name, previously_approved, revision_count, profiles!vehicles_operator_id_fkey ( username, operator_name )"
          )
          .eq("status", "pending")
          .order("created_at", { ascending: true });

        if (error) {
          showMessage("message", error.message);
          return;
        }

        const requests = data ?? [];
        const host = document.getElementById("requests");

        document.getElementById("queue-count").textContent =
          requests.length === 0
            ? "Queue clear"
            : `${requests.length} awaiting review`;

        if (requests.length === 0) {
          host.innerHTML = `<p class="empty">No vehicles awaiting approval.</p>`;
          return;
        }

        host.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Plate No.</th><th>Operator</th><th>Case No.</th>
                  <th>MV File #</th><th>OR No.</th><th>CR No.</th>
                  <th>Route</th><th>Bus No.</th><th>Seating</th>
                  <th>Seat</th><th>Aircon</th><th>Date granted</th>
                  <th>Date expiry</th><th>Documents</th><th></th>
                </tr>
              </thead>
              <tbody>
                ${requests
                  .map((v) => {
                    const operatorLabel =
                      v.profiles?.operator_name || v.profiles?.username || "Operator";
                    return `
                  <tr>
                    <td class="cell-strong" data-label="Plate No.">${escapeHtml(v.plate_no)}${
                      v.previously_approved
                        ? `<span class="revised">changed after approval</span>`
                        : v.revision_count > 0
                          ? `<span class="revised">changed &times;${v.revision_count}</span>`
                          : ""
                    }</td>
                    <td data-label="Operator">${escapeHtml(operatorLabel)}</td>
                    <td data-label="Case No.">${escapeHtml(v.case_number ?? "—")}</td>
                    <td data-label="MV File #">${escapeHtml(v.mv_file_number ?? "—")}</td>
                    <td data-label="OR No.">${escapeHtml(v.or_number ?? "—")}</td>
                    <td data-label="CR No.">${escapeHtml(v.cr_number ?? "—")}</td>
                    <td data-label="Route">${escapeHtml(v.route ?? "—")}</td>
                    <td data-label="Bus No.">${escapeHtml(v.bus_number ?? "—")}</td>
                    <td data-label="Seating">${v.seating_capacity ?? "—"}</td>
                    <td data-label="Seat">${escapeHtml(v.seat_type ?? "—")}</td>
                    <td data-label="Aircon">${airconLabel(v.aircon)}</td>
                    <td data-label="Date granted">${escapeHtml(v.date_granted ?? "—")}</td>
                    <td data-label="Date expiry">${escapeHtml(v.date_expiry ?? "—")}</td>
                    <td data-label="Documents" data-vehicle-docs="${escapeHtml(v.id)}">&hellip;</td>
                    <td>
                      <div class="row-actions">
                        <form data-approve="${escapeHtml(v.id)}">
                          <button type="submit" class="btn-approve">Approve</button>
                        </form>
                        <form data-reject="${escapeHtml(v.id)}">
                          <input placeholder="Reason (optional)" />
                          <button type="submit" class="btn-danger-outline">Reject</button>
                        </form>
                      </div>
                    </td>
                  </tr>`;
                  })
                  .join("")}
              </tbody>
            </table>
          </div>
        `;

        resolveDocLinks(requests);

        host.querySelectorAll("[data-approve]").forEach((form) => {
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            approve(form.dataset.approve);
          });
        });
        host.querySelectorAll("[data-reject]").forEach((form) => {
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            reject(form.dataset.reject, form.querySelector("input").value.trim());
          });
        });
      }

      // Signed URLs are resolved after the table paints (rather than
      // blocking the initial render on every row's storage round-trip),
      // same pattern as vehicles-database.html.
      async function resolveDocLinks(rows) {
        await Promise.all(
          rows.map(async (v) => {
            const cell = document.querySelector(`[data-vehicle-docs="${v.id}"]`);
            if (!cell) return;

            const links = [];
            if (v.photo_path) {
              const { data } = await supabase.storage
                .from("vehicle-docs")
                .createSignedUrl(v.photo_path, 300);
              if (data?.signedUrl) {
                links.push(
                  `<a href="${data.signedUrl}" target="_blank" rel="noopener">OR/CR photo</a>`
                );
              }
            }
            if (v.supporting_doc_path) {
              const { data } = await supabase.storage
                .from("vehicle-docs")
                .createSignedUrl(v.supporting_doc_path, 300);
              if (data?.signedUrl) {
                links.push(
                  `<a href="${data.signedUrl}" target="_blank" rel="noopener">${escapeHtml(
                    v.supporting_doc_name || "Supporting doc"
                  )}</a>`
                );
              }
            }
            cell.innerHTML = links.length ? links.join("<br />") : "—";
          })
        );
      }

      async function approve(vehicleId) {
        showMessage("message", "");
        const { data, error } = await supabase
          .from("vehicles")
          .update({
            status: "approved",
            rejection_reason: null,
            decided_by: profile.id,
            decided_at: new Date().toISOString(),
          })
          .eq("id", vehicleId)
          .eq("status", "pending")
          .select("id");

        if (error) {
          showMessage("message", error.message);
          return;
        }
        if (!data || data.length === 0) {
          showMessage("message", "That vehicle was already decided on.");
        }
        await load();
      }

      async function reject(vehicleId, reason) {
        showMessage("message", "");
        await supabase
          .from("vehicles")
          .update({
            status: "rejected",
            rejection_reason: reason || null,
            decided_by: profile.id,
            decided_at: new Date().toISOString(),
          })
          .eq("id", vehicleId)
          .eq("status", "pending");
        await load();
      }
    </script>
  </body>
</html>
