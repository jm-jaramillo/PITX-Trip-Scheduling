<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vehicle approvals · PITX Bus Bay Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="nav" id="nav"></header>

    <main class="wrap">
      <div class="page-head">
        <div>
          <p class="eyebrow">Transport Operations &middot; Fleet Approvals</p>
          <h1>Vehicle approvals</h1>
          <p class="subtle">
            Approve a vehicle so it appears in the operator's booking-form
            plate list, or reject it with an optional note.
          </p>
        </div>
        <p class="subtle" id="queue-count"></p>
      </div>

      <div class="mode-switch" role="tablist" id="view-tabs">
        <button type="button" class="mode-tab is-active" data-view="pending">Pending</button>
        <button type="button" class="mode-tab" data-view="decided">Recently decided</button>
      </div>

      <div class="toolbar" style="justify-content: space-between; margin-top: 18px" id="pending-toolbar">
        <div class="field" style="max-width: 360px; margin-bottom: 0">
          <label for="search">Search</label>
          <input id="search" placeholder="Operator, plate no., or route…" />
        </div>
        <div class="row-actions" style="position: relative; flex-wrap: wrap">
          <button type="button" class="btn-link" id="select-all">Select all</button>
          <button type="button" class="btn-outline" id="approve-selected" disabled>
            Approve selected
          </button>
          <button type="button" class="btn-danger-outline" id="reject-selected" disabled>
            Reject selected
          </button>
          <button type="button" class="btn-outline" id="columns-toggle">Columns</button>
          <div class="notif-panel hidden" id="columns-panel"></div>
          <button type="button" class="btn-outline" id="export-csv">Export CSV</button>
        </div>
      </div>

      <div class="hidden" id="message"></div>
      <div id="requests"></div>
      <div class="hidden" id="decided"></div>
    </main>

    <script type="module">
      import {
        supabase,
        guardPage,
        renderNav,
        showMessage,
        expiryCell,
        busTypeLabel,
        escapeHtml,
        downloadCsv,
      } from "./assets/app.js";

      const profile = await guardPage("staff");
      if (!profile) throw new Error("unauthorised");
      renderNav(profile);

      // Which of the approval-form columns are shown, persisted across
      // reloads so staff don't have to re-hide the same columns every
      // visit. Bumped to v2 when the vehicle field set changed (migration
      // 0035, OR/CR/dates/aircon dropped, several fields added) so a
      // stored selection referencing a since-removed column key doesn't
      // silently leave that many fewer columns visible than intended.
      const COLUMNS_STORAGE_KEY = "pitx.vehicleApprovals.columns.v2";

      // Every toggleable column, in table order. `key` doubles as the
      // data-col attribute shared by the <th> and its column's <td>s, so
      // visibility toggling is one selector per column rather than an
      // index-based show/hide that would drift if a column were reordered.
      const COLUMNS = [
        { key: "plate", label: "Plate No." },
        { key: "operator", label: "Operator" },
        { key: "case", label: "Case No." },
        { key: "mv", label: "MV File #" },
        { key: "chassis", label: "Chassis No." },
        { key: "franchise", label: "Franchise" },
        { key: "sticker", label: "Sticker No." },
        { key: "cpc", label: "CPC validity" },
        { key: "cpc_eov", label: "CPC EOV?" },
        { key: "cpc_eov_validity", label: "EOV validity" },
        { key: "orcr", label: "OR/CR validity" },
        { key: "route", label: "Route" },
        { key: "origin", label: "Origin" },
        { key: "destination", label: "Destination" },
        { key: "body", label: "Body Number" },
        { key: "year", label: "Year" },
        { key: "make", label: "Make" },
        { key: "bus_type", label: "Bus Type" },
        { key: "seating", label: "Seating" },
        { key: "seat", label: "Seat configuration" },
        { key: "remarks", label: "Remarks" },
        { key: "docs", label: "Documents" },
      ];

      // A sensible glance-view default - the rest stay one click away via
      // the Columns panel rather than cluttering the table on first load.
      const DEFAULT_VISIBLE_COLUMNS = [
        "plate",
        "operator",
        "route",
        "body",
        "cpc",
        "orcr",
        "docs",
      ];

      function loadVisibleColumns() {
        try {
          const raw = localStorage.getItem(COLUMNS_STORAGE_KEY);
          if (!raw) return new Set(DEFAULT_VISIBLE_COLUMNS);
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return new Set(DEFAULT_VISIBLE_COLUMNS);
          const known = new Set(COLUMNS.map((c) => c.key));
          return new Set(parsed.filter((k) => known.has(k)));
        } catch {
          return new Set(DEFAULT_VISIBLE_COLUMNS);
        }
      }

      function saveVisibleColumns() {
        localStorage.setItem(
          COLUMNS_STORAGE_KEY,
          JSON.stringify([...visibleColumns])
        );
      }

      let visibleColumns = loadVisibleColumns();

      // Keeps the last full pending fetch around so the search box and
      // column toggle can both re-render client-side without re-querying.
      let pendingRequests = [];
      let view = "pending";
      const selectedIds = new Set();

      initViewTabs();
      initColumnsPanel();
      document.getElementById("search").addEventListener("input", render);
      document.getElementById("select-all").addEventListener("click", toggleSelectAll);
      document.getElementById("approve-selected").addEventListener("click", approveSelected);
      document.getElementById("reject-selected").addEventListener("click", rejectSelected);
      document.getElementById("export-csv").addEventListener("click", exportCsv);

      await load();

      function initViewTabs() {
        document.querySelectorAll("#view-tabs [data-view]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            view = btn.dataset.view;
            document
              .querySelectorAll("#view-tabs [data-view]")
              .forEach((b) => b.classList.toggle("is-active", b === btn));
            document.getElementById("pending-toolbar").classList.toggle("hidden", view !== "pending");
            document.getElementById("requests").classList.toggle("hidden", view !== "pending");
            document.getElementById("decided").classList.toggle("hidden", view !== "decided");
            showMessage("message", "");
            if (view === "decided") await loadDecided();
          });
        });
      }

      /* ----------------------------------------------------- columns panel */

      function initColumnsPanel() {
        const panel = document.getElementById("columns-panel");
        const toggle = document.getElementById("columns-toggle");

        panel.innerHTML = COLUMNS.map(
          (col) => `
            <label class="notif-item" style="display: flex; gap: 8px; align-items: center; cursor: pointer">
              <input type="checkbox" data-col-toggle="${col.key}" ${
                visibleColumns.has(col.key) ? "checked" : ""
              } />
              ${escapeHtml(col.label)}
            </label>
          `
        ).join("");

        panel.querySelectorAll("[data-col-toggle]").forEach((cb) => {
          cb.addEventListener("change", () => {
            const key = cb.dataset.colToggle;
            if (cb.checked) visibleColumns.add(key);
            else visibleColumns.delete(key);
            saveVisibleColumns();
            applyColumnVisibility();
          });
        });

        toggle.addEventListener("click", (e) => {
          e.stopPropagation();
          panel.classList.toggle("hidden");
        });
        document.addEventListener("click", (e) => {
          if (!panel.contains(e.target) && e.target !== toggle) panel.classList.add("hidden");
        });
      }

      // Toggles both the <th> and every <td> sharing a data-col value -
      // called after every render() (the table is rebuilt each time) and
      // whenever a checkbox in the Columns panel changes.
      function applyColumnVisibility() {
        COLUMNS.forEach((col) => {
          const shown = visibleColumns.has(col.key);
          document.querySelectorAll(`[data-col="${col.key}"]`).forEach((el) => {
            el.style.display = shown ? "" : "none";
          });
        });
      }

      function operatorLabel(v) {
        return v.profiles?.operator_name || v.profiles?.username || "Operator";
      }

      async function load() {
        const { data, error } = await supabase
          .from("vehicles")
          .select(
            // vehicles has two FKs into profiles (operator_id, decided_by),
            // so the embed needs the constraint name to disambiguate which.
            "id, operator_id, plate_no, case_number, mv_file_number, chassis_no, franchise, cpc_validity, cpc_eov, cpc_eov_validity, orcr_validity, sticker_no, route, origin, destination, body_number, vehicle_year, vehicle_make, bus_type, seating_capacity, seat_type, remarks, source, photo_path, supporting_doc_path, supporting_doc_name, seat_layout_path, seat_layout_name, previously_approved, revision_count, profiles!vehicles_operator_id_fkey ( username, operator_name )"
          )
          .eq("status", "pending")
          .order("created_at", { ascending: true });

        if (error) {
          showMessage("message", error.message);
          return;
        }

        pendingRequests = data ?? [];
        // A reload can drop rows that were selected (approved/rejected
        // elsewhere in the meantime) - drop stale ids so the bulk buttons'
        // disabled state stays accurate.
        const stillPending = new Set(pendingRequests.map((v) => v.id));
        [...selectedIds].forEach((id) => {
          if (!stillPending.has(id)) selectedIds.delete(id);
        });

        render();
      }

      function filteredRequests() {
        const query = document.getElementById("search").value.trim().toLowerCase();
        if (!query) return pendingRequests;
        return pendingRequests.filter((v) =>
          [v.plate_no, v.route, v.profiles?.operator_name, v.profiles?.username]
            .filter(Boolean)
            .some((s) => s.toLowerCase().includes(query))
        );
      }

      function render() {
        const requests = filteredRequests();
        const host = document.getElementById("requests");

        document.getElementById("queue-count").textContent =
          pendingRequests.length === 0
            ? "Queue clear"
            : `${pendingRequests.length} awaiting review`;

        if (pendingRequests.length === 0) {
          host.innerHTML = `<p class="empty">No vehicles awaiting approval.</p>`;
          updateBulkButtons();
          return;
        }

        if (requests.length === 0) {
          host.innerHTML = `<p class="empty">No matches.</p>`;
          updateBulkButtons();
          return;
        }

        host.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th><input type="checkbox" id="row-select-all" /></th>
                  <th data-col="plate">Plate No.</th><th data-col="operator">Operator</th>
                  <th data-col="case">Case No.</th>
                  <th data-col="mv">MV File #</th>
                  <th data-col="chassis">Chassis No.</th><th data-col="franchise">Franchise</th><th data-col="sticker">Sticker No.</th>
                  <th data-col="cpc">CPC validity</th><th data-col="cpc_eov">CPC EOV?</th><th data-col="cpc_eov_validity">EOV validity</th>
                  <th data-col="orcr">OR/CR validity</th>
                  <th data-col="route">Route</th><th data-col="origin">Origin</th><th data-col="destination">Destination</th>
                  <th data-col="body">Body Number</th><th data-col="year">Year</th><th data-col="make">Make</th>
                  <th data-col="bus_type">Bus Type</th><th data-col="seating">Seating</th>
                  <th data-col="seat">Seat configuration</th><th data-col="remarks">Remarks</th>
                  <th data-col="docs">Documents</th><th></th>
                </tr>
              </thead>
              <tbody>
                ${requests
                  .map((v) => {
                    const label = operatorLabel(v);
                    return `
                  <tr>
                    <td><input type="checkbox" data-select="${escapeHtml(v.id)}" ${
                      selectedIds.has(v.id) ? "checked" : ""
                    } /></td>
                    <td class="cell-strong" data-col="plate" data-label="Plate No.">${escapeHtml(v.plate_no)}${
                      v.previously_approved
                        ? `<span class="revised">changed after approval</span>`
                        : v.revision_count > 0
                          ? `<span class="revised">changed &times;${v.revision_count}</span>`
                          : ""
                    }</td>
                    <td data-col="operator" data-label="Operator">${escapeHtml(label)}</td>
                    <td data-col="case" data-label="Case No.">${escapeHtml(v.case_number ?? "—")}</td>
                    <td data-col="mv" data-label="MV File #">${escapeHtml(v.mv_file_number ?? "—")}</td>
                    <td data-col="chassis" data-label="Chassis No.">${escapeHtml(v.chassis_no ?? "—")}</td>
                    <td data-col="franchise" data-label="Franchise">${escapeHtml(v.franchise ?? "—")}</td>
                    <td data-col="sticker" data-label="Sticker No.">${escapeHtml(v.sticker_no ?? "—")}</td>
                    <td data-col="cpc" data-label="CPC validity">${expiryCell(v.cpc_validity, escapeHtml)}</td>
                    <td data-col="cpc_eov" data-label="CPC EOV?">${v.cpc_eov ? "Yes" : "No"}</td>
                    <td data-col="cpc_eov_validity" data-label="EOV validity">${v.cpc_eov ? expiryCell(v.cpc_eov_validity, escapeHtml) : "—"}</td>
                    <td data-col="orcr" data-label="OR/CR validity">${expiryCell(v.orcr_validity, escapeHtml)}</td>
                    <td data-col="route" data-label="Route">${escapeHtml(v.route ?? "—")}</td>
                    <td data-col="origin" data-label="Origin">${escapeHtml(v.origin ?? "—")}</td>
                    <td data-col="destination" data-label="Destination">${escapeHtml(v.destination ?? "—")}</td>
                    <td data-col="body" data-label="Body Number">${escapeHtml(v.body_number ?? "—")}</td>
                    <td data-col="year" data-label="Year">${escapeHtml(v.vehicle_year ?? "—")}</td>
                    <td data-col="make" data-label="Make">${escapeHtml(v.vehicle_make ?? "—")}</td>
                    <td data-col="bus_type" data-label="Bus Type">${busTypeLabel(v.bus_type)}</td>
                    <td data-col="seating" data-label="Seating">${v.seating_capacity ?? "—"}</td>
                    <td data-col="seat" data-label="Seat configuration">${escapeHtml(v.seat_type ?? "—")}</td>
                    <td data-col="remarks" data-label="Remarks">${escapeHtml(v.remarks ?? "—")}</td>
                    <td data-col="docs" data-label="Documents" data-vehicle-docs="${escapeHtml(v.id)}">&hellip;</td>
                    <td>
                      <div class="row-actions">
                        <form data-approve="${escapeHtml(v.id)}">
                          <button type="submit" class="btn-approve">Approve</button>
                        </form>
                        <form data-reject="${escapeHtml(v.id)}">
                          <input placeholder="Reason (optional)" />
                          <button type="submit" class="btn-danger-outline">Reject</button>
                        </form>
                      </div>
                    </td>
                  </tr>`;
                  })
                  .join("")}
              </tbody>
            </table>
          </div>
        `;

        resolveDocLinks(requests);
        applyColumnVisibility();

        host.querySelectorAll("[data-approve]").forEach((form) => {
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            approve(form.dataset.approve);
          });
        });
        host.querySelectorAll("[data-reject]").forEach((form) => {
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            reject(form.dataset.reject, form.querySelector("input").value.trim());
          });
        });
        host.querySelectorAll("[data-select]").forEach((cb) => {
          cb.addEventListener("change", () => {
            if (cb.checked) selectedIds.add(cb.dataset.select);
            else selectedIds.delete(cb.dataset.select);
            updateBulkButtons();
            syncRowSelectAll(requests);
          });
        });

        const rowSelectAll = document.getElementById("row-select-all");
        rowSelectAll?.addEventListener("change", () => {
          requests.forEach((v) => {
            if (rowSelectAll.checked) selectedIds.add(v.id);
            else selectedIds.delete(v.id);
          });
          render();
        });
        syncRowSelectAll(requests);
        updateBulkButtons();
      }

      function syncRowSelectAll(requests) {
        const rowSelectAll = document.getElementById("row-select-all");
        if (!rowSelectAll) return;
        rowSelectAll.checked =
          requests.length > 0 && requests.every((v) => selectedIds.has(v.id));
      }

      function updateBulkButtons() {
        const disabled = selectedIds.size === 0;
        document.getElementById("approve-selected").disabled = disabled;
        document.getElementById("reject-selected").disabled = disabled;
      }

      // "Select all" in the toolbar (as distinct from the in-table header
      // checkbox) selects every row currently matching the search filter.
      function toggleSelectAll() {
        const requests = filteredRequests();
        const allSelected =
          requests.length > 0 && requests.every((v) => selectedIds.has(v.id));
        requests.forEach((v) => {
          if (allSelected) selectedIds.delete(v.id);
          else selectedIds.add(v.id);
        });
        render();
      }

      // Signed URLs are resolved after the table paints (rather than
      // blocking the initial render on every row's storage round-trip),
      // same pattern as vehicles-database.html.
      async function resolveDocLinks(rows) {
        await Promise.all(
          rows.map(async (v) => {
            const cell = document.querySelector(`[data-vehicle-docs="${v.id}"]`);
            if (!cell) return;

            const links = [];
            if (v.photo_path) {
              const { data } = await supabase.storage
                .from("vehicle-docs")
                .createSignedUrl(v.photo_path, 300);
              if (data?.signedUrl) {
                links.push(
                  `<a href="${data.signedUrl}" target="_blank" rel="noopener">OR/CR photo</a>`
                );
              }
            }
            if (v.supporting_doc_path) {
              const { data } = await supabase.storage
                .from("vehicle-docs")
                .createSignedUrl(v.supporting_doc_path, 300);
              if (data?.signedUrl) {
                links.push(
                  `<a href="${data.signedUrl}" target="_blank" rel="noopener">${escapeHtml(
                    v.supporting_doc_name || "Supporting doc"
                  )}</a>`
                );
              }
            }
            cell.innerHTML = links.length ? links.join("<br />") : "—";
          })
        );
      }

      // Core status-update queries, shared by the single-row and bulk
      // approve/reject actions so both paths stay identical. Neither
      // reloads or messages on its own - the caller decides when.
      async function approveVehicle(vehicleId) {
        const { data, error } = await supabase
          .from("vehicles")
          .update({
            status: "approved",
            rejection_reason: null,
            decided_by: profile.id,
            decided_at: new Date().toISOString(),
          })
          .eq("id", vehicleId)
          .eq("status", "pending")
          .select("id");

        if (error) return { ok: false, error };
        return { ok: true, decided: (data ?? []).length > 0 };
      }

      async function rejectVehicle(vehicleId, reason) {
        const { error } = await supabase
          .from("vehicles")
          .update({
            status: "rejected",
            rejection_reason: reason || null,
            decided_by: profile.id,
            decided_at: new Date().toISOString(),
          })
          .eq("id", vehicleId)
          .eq("status", "pending");

        if (error) return { ok: false, error };
        return { ok: true };
      }

      async function approve(vehicleId) {
        showMessage("message", "");
        const result = await approveVehicle(vehicleId);
        if (!result.ok) {
          showMessage("message", result.error.message);
          return;
        }
        if (!result.decided) {
          showMessage("message", "That vehicle was already decided on.");
        }
        selectedIds.delete(vehicleId);
        await load();
      }

      async function reject(vehicleId, reason) {
        showMessage("message", "");
        const result = await rejectVehicle(vehicleId, reason);
        if (!result.ok) {
          showMessage("message", result.error.message);
          return;
        }
        selectedIds.delete(vehicleId);
        await load();
      }

      async function approveSelected() {
        if (selectedIds.size === 0) return;
        showMessage("message", "");
        const ids = [...selectedIds];
        let approved = 0;
        for (const id of ids) {
          const result = await approveVehicle(id);
          if (result.ok && result.decided) approved += 1;
        }
        selectedIds.clear();
        await load();
        showMessage(
          "message",
          `Approved ${approved} vehicle${approved === 1 ? "" : "s"}.`,
          "ok"
        );
      }

      async function rejectSelected() {
        if (selectedIds.size === 0) return;
        // One shared reason for the whole batch, prompted once up front -
        // matches the single-row Reject form's optional free-text reason.
        const reason = prompt("Rejection reason (optional, applied to all selected):", "") ?? "";
        showMessage("message", "");
        const ids = [...selectedIds];
        let rejected = 0;
        for (const id of ids) {
          const result = await rejectVehicle(id, reason.trim());
          if (result.ok) rejected += 1;
        }
        selectedIds.clear();
        await load();
        showMessage(
          "message",
          `Rejected ${rejected} vehicle${rejected === 1 ? "" : "s"}.`,
          "ok"
        );
      }

      /* --------------------------------------------------------- CSV export */

      // Plain-text value per column key, mirroring the table cells above
      // but without any HTML - used only for the CSV export.
      const CSV_VALUE = {
        plate: (v) => v.plate_no ?? "",
        operator: (v) => operatorLabel(v),
        case: (v) => v.case_number ?? "",
        mv: (v) => v.mv_file_number ?? "",
        chassis: (v) => v.chassis_no ?? "",
        franchise: (v) => v.franchise ?? "",
        sticker: (v) => v.sticker_no ?? "",
        cpc: (v) => v.cpc_validity ?? "",
        cpc_eov: (v) => (v.cpc_eov ? "Yes" : "No"),
        cpc_eov_validity: (v) => v.cpc_eov_validity ?? "",
        orcr: (v) => v.orcr_validity ?? "",
        route: (v) => v.route ?? "",
        origin: (v) => v.origin ?? "",
        destination: (v) => v.destination ?? "",
        body: (v) => v.body_number ?? "",
        year: (v) => v.vehicle_year ?? "",
        make: (v) => v.vehicle_make ?? "",
        bus_type: (v) => busTypeLabel(v.bus_type),
        seating: (v) => v.seating_capacity ?? "",
        seat: (v) => v.seat_type ?? "",
        remarks: (v) => v.remarks ?? "",
        docs: () => "",
      };

      // Exports exactly what's on screen - the search-filtered rows, and
      // only the columns currently toggled on in the Columns panel.
      function exportCsv() {
        const cols = COLUMNS.filter((c) => visibleColumns.has(c.key));
        const headers = cols.map((c) => c.label);
        const rows = filteredRequests().map((v) => cols.map((c) => CSV_VALUE[c.key](v)));
        downloadCsv("pending-vehicle-approvals.csv", headers, rows);
      }

      /* ------------------------------------------------------ decided view */

      async function loadDecided() {
        const host = document.getElementById("decided");
        host.innerHTML = `<p class="empty">Loading&hellip;</p>`;

        const { data, error } = await supabase
          .from("vehicles")
          .select(
            // Same two-FK situation as the pending query above, plus a
            // second embed for whoever decided it - vehicles_decided_by_fkey
            // is Postgres's default-generated name for the unnamed
            // `decided_by uuid references profiles(id)` column added in
            // migration 0005, the same convention vehicles_operator_id_fkey
            // already relies on elsewhere in this codebase.
            "id, plate_no, route, status, decided_at, rejection_reason, profiles!vehicles_operator_id_fkey ( username, operator_name ), decider:profiles!vehicles_decided_by_fkey ( username, operator_name )"
          )
          .in("status", ["approved", "rejected"])
          // Postgres defaults DESC to NULLS FIRST - most vehicles here
          // were bulk-imported straight to "approved" with no decided_at
          // at all, which would otherwise bury every genuinely-decided
          // row underneath ~1,800 nulls. nullsFirst: false forces actual
          // decisions to the top instead, where "recently decided" means.
          .order("decided_at", { ascending: false, nullsFirst: false })
          .limit(50);

        if (error) {
          showMessage("message", error.message);
          host.innerHTML = `<p class="empty">Couldn't load recently decided vehicles.</p>`;
          return;
        }

        const rows = data ?? [];
        if (rows.length === 0) {
          host.innerHTML = `<p class="empty">No decisions yet.</p>`;
          return;
        }

        host.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Plate No.</th><th>Operator</th><th>Route</th>
                  <th>Status</th><th>Decided by</th><th>Decided at</th><th>Note</th>
                </tr>
              </thead>
              <tbody>
                ${rows
                  .map((v) => {
                    const label = operatorLabel(v);
                    const decider =
                      v.decider?.operator_name || v.decider?.username || "—";
                    return `
                  <tr>
                    <td class="cell-strong" data-label="Plate No.">${escapeHtml(v.plate_no)}</td>
                    <td data-label="Operator">${escapeHtml(label)}</td>
                    <td data-label="Route">${escapeHtml(v.route ?? "—")}</td>
                    <td data-label="Status">${escapeHtml(v.status)}</td>
                    <td data-label="Decided by">${escapeHtml(decider)}</td>
                    <td data-label="Decided at">${escapeHtml(v.decided_at ?? "—")}</td>
                    <td data-label="Note">${escapeHtml(v.rejection_reason ?? "—")}</td>
                  </tr>`;
                  })
                  .join("")}
              </tbody>
            </table>
          </div>
        `;
      }
    </script>
  </body>
</html>
