<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Schedule · PITX Bus Bay Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="nav" id="nav"></header>

    <main class="wrap">
      <div class="page-head">
        <div>
          <p class="eyebrow">Transport Operations &middot; Bay Monitor</p>
          <h1>Schedule</h1>
          <p class="subtle" id="capacity-note"></p>
        </div>
        <div class="toolbar">
          <div class="mode-switch" role="tablist" id="view-mode">
            <button type="button" class="mode-tab is-active" data-view="day">Day</button>
            <button type="button" class="mode-tab" data-view="week">Week</button>
          </div>
          <div class="mode-switch hidden" role="tablist" id="density-mode">
            <button type="button" class="mode-tab is-active" data-density="half">Half-hour</button>
            <button type="button" class="mode-tab" data-density="hour">Hourly</button>
          </div>
          <button type="button" class="btn-outline" id="prev">&larr; Prev</button>
          <input type="date" id="date" />
          <button type="button" class="btn-outline" id="next">Next &rarr;</button>
          <button type="button" class="btn-outline" id="export-csv">Export CSV</button>
        </div>
      </div>

      <div class="kpis" id="kpis"></div>

      <div class="hidden" id="message"></div>
      <div class="hidden" id="heat-legend-wrap" style="margin-bottom: 10px">
        <div class="heat-legend">
          Empty
          <span class="heat-legend-scale">
            <span style="background: var(--heat-0)"></span>
            <span style="background: var(--heat-1)"></span>
            <span style="background: var(--heat-2)"></span>
            <span style="background: var(--heat-3)"></span>
            <span style="background: var(--heat-4)"></span>
            <span style="background: var(--heat-full)"></span>
          </span>
          Full &middot; click a cell for the booking list
        </div>
      </div>
      <div id="grid"></div>
    </main>

    <script type="module">
      import {
        supabase,
        guardPage,
        renderNav,
        SLOTS,
        formatSlot,
        todayISO,
        addDays,
        weekDates,
        statusBadge,
        bookingOperatorHtml,
        gateForRoute,
        showMessage,
        escapeHtml,
        downloadCsv,
      } from "./assets/app.js";

      const profile = await guardPage("staff");
      if (!profile) throw new Error("unauthorised");
      renderNav(profile);

      const dateInput = document.getElementById("date");
      // Allow deep-linking to a specific day: schedule.html?date=YYYY-MM-DD
      const fromQuery = new URLSearchParams(location.search).get("date");
      let currentDate = /^\d{4}-\d{2}-\d{2}$/.test(fromQuery ?? "")
        ? fromQuery
        : todayISO();
      dateInput.value = currentDate;

      // "Day" is the original single-date grid; "Week" is a 7-day
      // occupancy heat grid (see loadWeek()) with a link into Day view
      // per date - full per-slot detail for 7 days at once would be an
      // unusable wall of stacked booking cards, so Week shows just a
      // fill count per cell (coloured by how full the slot is) and
      // expands the actual bookings only when a cell is clicked. Day
      // stays the place bookings are actually reviewed and bays
      // reassigned.
      let viewMode = "day";
      // Week view density: "half" is the real 48-slot grid, "hour"
      // collapses each pair of half-hour slots into one row (summed
      // count) for a coarser first look at a busy week.
      let weekDensity = "half";
      // (date, slot) of the currently expanded heat cell, or null -
      // only one detail row is open at a time. In "hour" density this
      // holds the first of the pair of half-hour slots the row covers.
      let expandedCell = null;

      document.querySelectorAll("#view-mode [data-view]").forEach((btn) => {
        btn.addEventListener("click", () => {
          viewMode = btn.dataset.view;
          expandedCell = null;
          document
            .querySelectorAll("#view-mode [data-view]")
            .forEach((b) => b.classList.toggle("is-active", b === btn));
          document.getElementById("prev").textContent =
            viewMode === "week" ? "← Prev week" : "← Prev day";
          document.getElementById("next").textContent =
            viewMode === "week" ? "Next week →" : "Next day →";
          document
            .getElementById("density-mode")
            .classList.toggle("hidden", viewMode !== "week");
          document
            .getElementById("heat-legend-wrap")
            .classList.toggle("hidden", viewMode !== "week");
          load();
        });
      });

      document.querySelectorAll("#density-mode [data-density]").forEach((btn) => {
        btn.addEventListener("click", () => {
          weekDensity = btn.dataset.density;
          expandedCell = null;
          document
            .querySelectorAll("#density-mode [data-density]")
            .forEach((b) => b.classList.toggle("is-active", b === btn));
          renderWeekGrid();
        });
      });

      dateInput.addEventListener("change", () => {
        if (dateInput.value) {
          currentDate = dateInput.value;
          load();
        }
      });
      document.getElementById("prev").addEventListener("click", () => {
        currentDate = addDays(currentDate, viewMode === "week" ? -7 : -1);
        dateInput.value = currentDate;
        load();
      });
      document.getElementById("next").addEventListener("click", () => {
        currentDate = addDays(currentDate, viewMode === "week" ? 7 : 1);
        dateInput.value = currentDate;
        load();
      });

      document.getElementById("export-csv").addEventListener("click", () => {
        if (viewMode === "week") {
          exportWeekCsv();
        } else {
          exportDayCsv();
        }
      });

      // Retained from the most recent loadDay()/loadWeek() call so the
      // Export CSV button can reuse the already-fetched bookings instead
      // of refetching from Supabase just for the export.
      let lastDayBookings = [];
      let lastWeekBookings = [];

      // Retained from the most recent loadWeek() fetch so renderWeekGrid()
      // can redraw the grid (e.g. on a density toggle or a cell
      // expand/collapse) without refetching from Supabase. Declared here,
      // ahead of the module's top-level `await load()` a few lines down,
      // same TDZ-avoidance reason as lastDayBookings/lastWeekBookings.
      let weekDays = [];
      let weekCellsByDate = new Map();
      let weekTotalBays = 0;

      const CSV_HEADERS = [
        "Date",
        "Time slot",
        "Operator",
        "Trade Name",
        "Route",
        "Plate No.",
        "Status",
        "Assigned bay",
        "Trip No.",
      ];

      function bookingToCsvRow(b) {
        return [
          b.booking_date ?? currentDate,
          formatSlot(b.slot),
          b.operator_name ?? "",
          b.trade_name ?? "",
          b.route ?? "",
          b.plate_no ?? "",
          b.status ?? "",
          b.bays?.name ?? "",
          b.trip_number ?? "",
        ];
      }

      function exportDayCsv() {
        const rows = [...lastDayBookings]
          .sort((a, b) => a.slot - b.slot)
          .map(bookingToCsvRow);
        downloadCsv(`schedule-${currentDate}.csv`, CSV_HEADERS, rows);
      }

      function exportWeekCsv() {
        const days = weekDates(currentDate);
        const rows = [...lastWeekBookings]
          .sort(
            (a, b) =>
              a.booking_date.localeCompare(b.booking_date) || a.slot - b.slot
          )
          .map(bookingToCsvRow);
        downloadCsv(
          `schedule-week-${days[0]}-to-${days[6]}.csv`,
          CSV_HEADERS,
          rows
        );
      }

      await load();

      async function load() {
        return viewMode === "week" ? loadWeek() : loadDay();
      }

      async function loadDay() {
        const [baysRes, bookingsRes] = await Promise.all([
          supabase.from("bays").select("id, name, gate").eq("is_active", true),
          supabase
            .from("bookings")
            .select(
              "id, operator_name, previous_operator_name, trade_name, previous_trade_name, route, plate_no, slot, status, trip_number, bays ( id, name )"
            )
            .eq("booking_date", currentDate)
            .in("status", ["pending", "approved"])
            .order("slot", { ascending: true }),
        ]);

        const activeBays = baysRes.data ?? [];
        const totalBays = activeBays.length;
        const bookings = bookingsRes.data ?? [];
        lastDayBookings = bookings;

        document.getElementById("capacity-note").textContent =
          `Arrivals for ${currentDate}. Each 30-minute slot holds at most ` +
          `${totalBays} approved bus${totalBays === 1 ? "" : "es"}.`;

        const bySlot = new Map();
        for (const b of bookings) {
          if (!bySlot.has(b.slot)) bySlot.set(b.slot, []);
          bySlot.get(b.slot).push(b);
        }

        const approvedTotal = bookings.filter(
          (b) => b.status === "approved"
        ).length;
        const pendingTotal = bookings.length - approvedTotal;
        // Slots where every active bay is already committed.
        const fullSlots = SLOTS.filter(
          (s) =>
            totalBays > 0 &&
            (bySlot.get(s) ?? []).filter((b) => b.status === "approved")
              .length >= totalBays
        ).length;

        document.getElementById("kpis").innerHTML = [
          { label: "Approved today", value: approvedTotal, unit: "buses" },
          { label: "Awaiting review", value: pendingTotal, unit: "requests" },
          { label: "Active bays", value: totalBays, unit: "per slot" },
          { label: "Slots at capacity", value: fullSlots, unit: "of 48" },
        ]
          .map(
            (k) => `
            <div class="kpi">
              <div class="kpi-label">${escapeHtml(k.label)}</div>
              <div class="kpi-value">
                <strong>${k.value}</strong><span>${escapeHtml(k.unit)}</span>
              </div>
            </div>`
          )
          .join("");

        document.getElementById("grid").innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Time slot</th><th>Approved / capacity</th><th>Bookings</th>
                </tr>
              </thead>
              <tbody>
                ${SLOTS.map((slot) => {
                  const rows = bySlot.get(slot) ?? [];
                  const approved = rows.filter(
                    (b) => b.status === "approved"
                  ).length;
                  const atCapacity = totalBays > 0 && approved >= totalBays;
                  return `
                    <tr>
                      <td class="hour-cell" data-label="Time slot">${escapeHtml(formatSlot(slot))}</td>
                      <td class="capacity${
                        atCapacity ? " capacity-full" : ""
                      }" data-label="Approved / capacity">${approved} / ${totalBays}</td>
                      <td data-label="Bookings">${
                        rows.length === 0
                          ? '<span class="muted">—</span>'
                          : `<ul class="bookings-list">${rows
                              .map(
                                (b) =>
                                  `<li>${statusBadge(b.status)}<span>${bookingOperatorHtml(
                                    b
                                  )} &middot; ${escapeHtml(
                                    b.plate_no
                                  )} &middot; ${escapeHtml(b.route)}</span>${
                                    b.trip_number
                                      ? `<span class="trip-tag">${escapeHtml(b.trip_number)}</span>`
                                      : ""
                                  }${
                                    b.status === "approved"
                                      ? bayReassignHtml(b, activeBays, bookings)
                                      : b.bays?.name
                                        ? `<span class="bay-tag">${escapeHtml(
                                            b.bays.name
                                          )}</span>`
                                        : ""
                                  }</li>`
                              )
                              .join("")}</ul>`
                      }</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;

        document.querySelectorAll("[data-reassign-bay]").forEach((form) => {
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            reassignBay(
              form.dataset.reassignBay,
              form.querySelector("select").value
            );
          });
        });
      }

      function formatDayHeading(iso) {
        const [y, m, d] = iso.split("-").map(Number);
        // Noon avoids any timezone edge landing on the wrong calendar day.
        const date = new Date(y, m - 1, d, 12);
        return date.toLocaleDateString(undefined, {
          weekday: "short",
          month: "short",
          day: "numeric",
        });
      }

      // A 7-day grid (Mon-Sun of the week containing currentDate) - the
      // same KPIs Day view shows for a single date, so staff can spot a
      // busy day across the week before drilling into it. Unlike Day
      // view, cells here show only a fill count (coloured by how full
      // the slot is) - the 27-line wall of bookings a full slot would
      // otherwise render, times 48 rows times 7 columns, made "Week"
      // unusable the moment real demand showed up. Clicking a cell
      // expands its actual bookings (with trip numbers) into a detail
      // row underneath; "View day" on each date header still jumps into
      // Day view for the bay-reassignment control this grid has no room
      // for.
      // Supabase caps a plain .select() at 1000 rows - a slow week (7
      // days x up to 48 slots x up to ~27 approved buses, plus pending
      // overflow) can comfortably clear that, so this pages through with
      // .range() until a page comes back short, same pattern as
      // vehicles-database.html's fleet list. Without it, Week view would
      // silently under-count some slots (a "26/27" that's really full)
      // with no visible sign anything was cut off.
      const WEEK_PAGE_SIZE = 1000;

      async function loadWeek() {
        const days = weekDates(currentDate);
        const baysPromise = supabase.from("bays").select("id").eq("is_active", true);

        let bookings = [];
        for (let from = 0; ; from += WEEK_PAGE_SIZE) {
          const { data, error } = await supabase
            .from("bookings")
            .select(
              "id, operator_name, previous_operator_name, trade_name, previous_trade_name, route, plate_no, booking_date, slot, status, trip_number, bays ( id, name )"
            )
            .gte("booking_date", days[0])
            .lte("booking_date", days[6])
            .in("status", ["pending", "approved"])
            .order("booking_date", { ascending: true })
            .order("slot", { ascending: true })
            .range(from, from + WEEK_PAGE_SIZE - 1);
          if (error) {
            showMessage("message", error.message);
            return;
          }
          bookings.push(...(data ?? []));
          if (!data || data.length < WEEK_PAGE_SIZE) break;
        }

        const baysRes = await baysPromise;
        const totalBays = (baysRes.data ?? []).length;
        lastWeekBookings = bookings;

        document.getElementById("capacity-note").textContent =
          `Week of ${days[0]} – ${days[6]}. Each 30-minute slot holds at ` +
          `most ${totalBays} approved bus${totalBays === 1 ? "" : "es"}.`;

        const byDate = new Map(days.map((d) => [d, []]));
        for (const b of bookings) {
          byDate.get(b.booking_date)?.push(b);
        }

        // Per (date, slot) bookings - renderWeekGrid()'s cells look these
        // up on demand (both for the fill count and for a clicked cell's
        // expanded detail) - plus the per-day totals the KPI strip needs.
        const cellsByDate = new Map();
        const weekSummaries = days.map((date) => {
          const rows = byDate.get(date) ?? [];
          const approved = rows.filter((b) => b.status === "approved").length;
          const pending = rows.length - approved;
          const bySlot = new Map();
          for (const b of rows) {
            if (!bySlot.has(b.slot)) bySlot.set(b.slot, []);
            bySlot.get(b.slot).push(b);
          }
          cellsByDate.set(date, bySlot);
          const fullSlots =
            totalBays > 0
              ? SLOTS.filter(
                  (s) =>
                    (bySlot.get(s) ?? []).filter((b) => b.status === "approved")
                      .length >= totalBays
                ).length
              : 0;
          return { date, approved, pending, fullSlots };
        });

        document.getElementById("kpis").innerHTML = [
          {
            label: "Approved this week",
            value: weekSummaries.reduce((sum, w) => sum + w.approved, 0),
            unit: "buses",
          },
          {
            label: "Awaiting review",
            value: weekSummaries.reduce((sum, w) => sum + w.pending, 0),
            unit: "requests",
          },
          { label: "Active bays", value: totalBays, unit: "per slot" },
          {
            label: "Busiest day",
            value: weekSummaries.reduce(
              (max, w) => Math.max(max, w.fullSlots),
              0
            ),
            unit: "slots at capacity",
          },
        ]
          .map(
            (k) => `
            <div class="kpi">
              <div class="kpi-label">${escapeHtml(k.label)}</div>
              <div class="kpi-value">
                <strong>${k.value}</strong><span>${escapeHtml(k.unit)}</span>
              </div>
            </div>`
          )
          .join("");

        weekDays = days;
        weekCellsByDate = cellsByDate;
        weekTotalBays = totalBays;
        renderWeekGrid();
      }

      // Slot occupancy -> heat step. Five graduated steps between empty
      // and full (not just "full/not full") so the grid's colour shape
      // alone shows which bands of the day are busiest, before reading
      // a single number.
      function heatClass(approved, capacity) {
        if (capacity > 0 && approved >= capacity) return "heat-full";
        const pct = capacity > 0 ? approved / capacity : 0;
        if (pct === 0) return "heat-0";
        if (pct < 0.25) return "heat-1";
        if (pct < 0.5) return "heat-2";
        if (pct < 0.85) return "heat-3";
        return "heat-4";
      }

      // Shared with the click-to-expand detail row: the same booking
      // line Day view's Bookings column renders (status badge, transfer
      // strike-through, operator/plate/route, trip number, assigned
      // bay), just without the bay-reassignment control - that stays in
      // Day view, which "View day" jumps straight into.
      function bookingListHtml(rows) {
        if (rows.length === 0) {
          return '<p class="week-detail-empty">No bookings in this slot.</p>';
        }
        return `<ul class="week-detail-bookings">${rows
          .map(
            (b) => `
          <li>${statusBadge(b.status)}<span>${bookingOperatorHtml(
            b
          )} &middot; ${escapeHtml(
            b.plate_no
          )} &middot; ${escapeHtml(b.route)}</span>${
            b.trip_number
              ? `<span class="trip-tag">${escapeHtml(b.trip_number)}</span>`
              : ""
          }${
            b.bays?.name
              ? `<span class="bay-tag">${escapeHtml(b.bays.name)}</span>`
              : ""
          }</li>`
          )
          .join("")}</ul>`;
      }

      // Renders the heat grid itself from the module-level state loadWeek()
      // just populated - called again (without refetching) on a density
      // toggle or a cell expand/collapse.
      function renderWeekGrid() {
        const days = weekDays;
        const totalBays = weekTotalBays;
        const today = todayISO();
        // Half-hour density: one row per SLOT. Hourly: one row per pair
        // of half-hour slots (0&1, 2&3, ...), fill count summed across
        // both and compared against double capacity - a coarser first
        // look at a busy week, 24 rows instead of 48.
        const rowSlots =
          weekDensity === "hour"
            ? SLOTS.filter((s) => s % 2 === 0).map((s) => [s, s + 1])
            : SLOTS.map((s) => [s]);
        const rowCapacity = weekDensity === "hour" ? totalBays * 2 : totalBays;

        function rowsForCell(date, slots) {
          const bySlot = weekCellsByDate.get(date);
          return slots.flatMap((s) => bySlot?.get(s) ?? []);
        }

        document.getElementById("grid").innerHTML = `
          <div class="table-wrap table-plain">
            <table class="week-grid">
              <thead>
                <tr>
                  <th class="slot-col-head">Time slot</th>
                  ${days
                    .map(
                      (date) => `
                    <th${date === today ? ' class="week-today"' : ""}>
                      <button type="button" class="btn-link" data-view-day="${escapeHtml(
                        date
                      )}">${escapeHtml(formatDayHeading(date))}</button>
                      ${date === today ? "<small>Today</small>" : ""}
                    </th>`
                    )
                    .join("")}
                </tr>
              </thead>
              <tbody>
                ${rowSlots
                  .map((slots) => {
                    const rowKey = slots[0];
                    const label =
                      slots.length === 1
                        ? formatSlot(slots[0])
                        : formatSlot(slots[0]).split(" – ")[0] +
                          " – " +
                          formatSlot(slots[1]).split(" – ")[1];
                    const cellsHtml = days
                      .map((date) => {
                        const rows = rowsForCell(date, slots);
                        const approved = rows.filter((b) => b.status === "approved").length;
                        const isExpanded =
                          expandedCell &&
                          expandedCell.date === date &&
                          expandedCell.slot === rowKey;
                        return `
                        <td class="week-cell${date === today ? " week-today" : ""}">
                          <button
                            type="button"
                            class="heat-btn ${heatClass(approved, rowCapacity)}${
                              isExpanded ? " is-expanded" : ""
                            }"
                            data-cell-date="${escapeHtml(date)}"
                            data-cell-slot="${rowKey}"
                            aria-label="${escapeHtml(formatDayHeading(date))} ${escapeHtml(label)}: ${approved} of ${rowCapacity} approved"
                          >${approved === 0 ? "&mdash;" : approved}</button>
                        </td>`;
                      })
                      .join("");
                    const detailRow =
                      expandedCell && expandedCell.slot === rowKey
                        ? `
                      <tr class="week-detail-row">
                        <td colspan="${days.length + 1}">
                          <div class="week-detail-head">
                            <h4>${escapeHtml(formatDayHeading(expandedCell.date))} &middot; ${escapeHtml(label)}</h4>
                            <span class="week-detail-meta">${
                              rowsForCell(expandedCell.date, slots).filter(
                                (b) => b.status === "approved"
                              ).length
                            } / ${rowCapacity} approved</span>
                            <button type="button" class="btn-link" data-view-day="${escapeHtml(
                              expandedCell.date
                            )}">View day →</button>
                          </div>
                          ${bookingListHtml(rowsForCell(expandedCell.date, slots))}
                        </td>
                      </tr>`
                        : "";
                    return `
                    <tr>
                      <td class="hour-cell">${escapeHtml(label)}</td>
                      ${cellsHtml}
                    </tr>
                    ${detailRow}`;
                  })
                  .join("")}
              </tbody>
            </table>
          </div>
        `;

        document.querySelectorAll("[data-view-day]").forEach((btn) => {
          btn.addEventListener("click", () => {
            currentDate = btn.dataset.viewDay;
            dateInput.value = currentDate;
            viewMode = "day";
            document
              .querySelectorAll("#view-mode [data-view]")
              .forEach((b) => b.classList.toggle("is-active", b.dataset.view === "day"));
            document.getElementById("density-mode").classList.add("hidden");
            document.getElementById("heat-legend-wrap").classList.add("hidden");
            document.getElementById("prev").textContent = "← Prev day";
            document.getElementById("next").textContent = "Next day →";
            load();
          });
        });

        document.querySelectorAll("[data-cell-date]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const date = btn.dataset.cellDate;
            const slot = Number(btn.dataset.cellSlot);
            expandedCell =
              expandedCell && expandedCell.date === date && expandedCell.slot === slot
                ? null
                : { date, slot };
            renderWeekGrid();
          });
        });
      }

      // Staff can move an already-approved booking to a different bay -
      // e.g. correcting a mistaken assignment, or freeing up a bay for an
      // operational reason. Options are grouped: bays at the gate this
      // route is meant to use first, then every other bay not already
      // taken for this slot (the current bay is always included, even if
      // it's outside the suggested gate, so re-opening this never loses
      // the existing value).
      function bayReassignHtml(booking, activeBays, allBookingsThisDay) {
        const takenIds = new Set(
          allBookingsThisDay
            .filter(
              (other) =>
                other.slot === booking.slot &&
                other.status === "approved" &&
                other.id !== booking.id &&
                other.bays?.id
            )
            .map((other) => other.bays.id)
        );
        const available = activeBays.filter(
          (bay) => bay.id === booking.bays?.id || !takenIds.has(bay.id)
        );

        const gate = gateForRoute(booking.route);
        const suggested = gate ? available.filter((bay) => bay.gate === gate) : [];
        const other = gate ? available.filter((bay) => bay.gate !== gate) : available;

        const optionsHtml = (list) =>
          list
            .map(
              (bay) =>
                `<option value="${bay.id}"${
                  bay.id === booking.bays?.id ? " selected" : ""
                }>${escapeHtml(bay.name)}</option>`
            )
            .join("");

        return `
          <form class="bay-reassign" data-reassign-bay="${escapeHtml(booking.id)}">
            <select>
              ${
                suggested.length
                  ? `<optgroup label="Suggested (${escapeHtml(gate)})">${optionsHtml(
                      suggested
                    )}</optgroup>`
                  : ""
              }
              ${
                other.length
                  ? `<optgroup label="${suggested.length ? "Other bays" : "Bays"}">${optionsHtml(
                      other
                    )}</optgroup>`
                  : ""
              }
            </select>
            <button type="submit" class="btn-link">Save</button>
          </form>
        `;
      }

      async function reassignBay(bookingId, bayIdRaw) {
        showMessage("message", "");
        if (!bayIdRaw) return;

        const { error } = await supabase
          .from("bookings")
          .update({ assigned_bay_id: Number(bayIdRaw) })
          .eq("id", bookingId)
          .eq("status", "approved");

        if (error) {
          // 23505 = unique violation on the approved bay/slot index.
          showMessage(
            "message",
            error.code === "23505"
              ? "That bay is already taken for this slot. Pick a different one."
              : error.message
          );
          return;
        }
        await load();
      }
    </script>
  </body>
</html>
