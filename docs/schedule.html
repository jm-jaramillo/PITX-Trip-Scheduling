<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Schedule · PITX Bus Bay Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="nav" id="nav"></header>

    <main class="wrap">
      <div class="page-head">
        <div>
          <p class="eyebrow">Transport Operations &middot; Bay Monitor</p>
          <h1>Schedule</h1>
          <p class="subtle" id="capacity-note"></p>
        </div>
        <div class="toolbar">
          <div class="mode-switch" role="tablist" id="view-mode">
            <button type="button" class="mode-tab is-active" data-view="day">Day</button>
            <button type="button" class="mode-tab" data-view="week">Week</button>
          </div>
          <button type="button" class="btn-outline" id="prev">&larr; Prev</button>
          <input type="date" id="date" />
          <button type="button" class="btn-outline" id="next">Next &rarr;</button>
        </div>
      </div>

      <div class="kpis" id="kpis"></div>

      <div class="hidden" id="message"></div>
      <div id="grid"></div>
    </main>

    <script type="module">
      import {
        supabase,
        guardPage,
        renderNav,
        SLOTS,
        formatSlot,
        todayISO,
        addDays,
        weekDates,
        statusBadge,
        gateForRoute,
        showMessage,
        escapeHtml,
      } from "./assets/app.js";

      const profile = await guardPage("staff");
      if (!profile) throw new Error("unauthorised");
      renderNav(profile);

      const dateInput = document.getElementById("date");
      // Allow deep-linking to a specific day: schedule.html?date=YYYY-MM-DD
      const fromQuery = new URLSearchParams(location.search).get("date");
      let currentDate = /^\d{4}-\d{2}-\d{2}$/.test(fromQuery ?? "")
        ? fromQuery
        : todayISO();
      dateInput.value = currentDate;

      // "Day" is the original single-date grid; "Week" is a 7-day
      // summary (see loadWeek()) with a link into Day view per date -
      // full per-slot detail for 7 days at once would be an unusable
      // 48-row-by-7-column table, so Week trades detail for an overview
      // and Day stays the place bookings are actually reviewed.
      let viewMode = "day";
      document.querySelectorAll("#view-mode [data-view]").forEach((btn) => {
        btn.addEventListener("click", () => {
          viewMode = btn.dataset.view;
          document
            .querySelectorAll("#view-mode [data-view]")
            .forEach((b) => b.classList.toggle("is-active", b === btn));
          document.getElementById("prev").textContent =
            viewMode === "week" ? "← Prev week" : "← Prev day";
          document.getElementById("next").textContent =
            viewMode === "week" ? "Next week →" : "Next day →";
          load();
        });
      });

      dateInput.addEventListener("change", () => {
        if (dateInput.value) {
          currentDate = dateInput.value;
          load();
        }
      });
      document.getElementById("prev").addEventListener("click", () => {
        currentDate = addDays(currentDate, viewMode === "week" ? -7 : -1);
        dateInput.value = currentDate;
        load();
      });
      document.getElementById("next").addEventListener("click", () => {
        currentDate = addDays(currentDate, viewMode === "week" ? 7 : 1);
        dateInput.value = currentDate;
        load();
      });

      await load();

      async function load() {
        return viewMode === "week" ? loadWeek() : loadDay();
      }

      async function loadDay() {
        const [baysRes, bookingsRes] = await Promise.all([
          supabase.from("bays").select("id, name, gate").eq("is_active", true),
          supabase
            .from("bookings")
            .select(
              "id, operator_name, previous_operator_name, route, plate_no, slot, status, bays ( id, name )"
            )
            .eq("booking_date", currentDate)
            .in("status", ["pending", "approved"])
            .order("slot", { ascending: true }),
        ]);

        const activeBays = baysRes.data ?? [];
        const totalBays = activeBays.length;
        const bookings = bookingsRes.data ?? [];

        document.getElementById("capacity-note").textContent =
          `Arrivals for ${currentDate}. Each 30-minute slot holds at most ` +
          `${totalBays} approved bus${totalBays === 1 ? "" : "es"}.`;

        const bySlot = new Map();
        for (const b of bookings) {
          if (!bySlot.has(b.slot)) bySlot.set(b.slot, []);
          bySlot.get(b.slot).push(b);
        }

        const approvedTotal = bookings.filter(
          (b) => b.status === "approved"
        ).length;
        const pendingTotal = bookings.length - approvedTotal;
        // Slots where every active bay is already committed.
        const fullSlots = SLOTS.filter(
          (s) =>
            totalBays > 0 &&
            (bySlot.get(s) ?? []).filter((b) => b.status === "approved")
              .length >= totalBays
        ).length;

        document.getElementById("kpis").innerHTML = [
          { label: "Approved today", value: approvedTotal, unit: "buses" },
          { label: "Awaiting review", value: pendingTotal, unit: "requests" },
          { label: "Active bays", value: totalBays, unit: "per slot" },
          { label: "Slots at capacity", value: fullSlots, unit: "of 48" },
        ]
          .map(
            (k) => `
            <div class="kpi">
              <div class="kpi-label">${escapeHtml(k.label)}</div>
              <div class="kpi-value">
                <strong>${k.value}</strong><span>${escapeHtml(k.unit)}</span>
              </div>
            </div>`
          )
          .join("");

        document.getElementById("grid").innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Time slot</th><th>Approved / capacity</th><th>Bookings</th>
                </tr>
              </thead>
              <tbody>
                ${SLOTS.map((slot) => {
                  const rows = bySlot.get(slot) ?? [];
                  const approved = rows.filter(
                    (b) => b.status === "approved"
                  ).length;
                  const atCapacity = totalBays > 0 && approved >= totalBays;
                  return `
                    <tr>
                      <td class="hour-cell" data-label="Time slot">${escapeHtml(formatSlot(slot))}</td>
                      <td class="capacity${
                        atCapacity ? " capacity-full" : ""
                      }" data-label="Approved / capacity">${approved} / ${totalBays}</td>
                      <td data-label="Bookings">${
                        rows.length === 0
                          ? '<span class="muted">—</span>'
                          : `<ul class="bookings-list">${rows
                              .map(
                                (b) =>
                                  `<li>${statusBadge(b.status)}<span>${
                                    b.previous_operator_name
                                      ? `<s class="transferred-from">${escapeHtml(
                                          b.previous_operator_name
                                        )}</s> `
                                      : ""
                                  }${escapeHtml(
                                    b.operator_name
                                  )} &middot; ${escapeHtml(
                                    b.plate_no
                                  )} &middot; ${escapeHtml(b.route)}</span>${
                                    b.status === "approved"
                                      ? bayReassignHtml(b, activeBays, bookings)
                                      : b.bays?.name
                                        ? `<span class="bay-tag">${escapeHtml(
                                            b.bays.name
                                          )}</span>`
                                        : ""
                                  }</li>`
                              )
                              .join("")}</ul>`
                      }</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;

        document.querySelectorAll("[data-reassign-bay]").forEach((form) => {
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            reassignBay(
              form.dataset.reassignBay,
              form.querySelector("select").value
            );
          });
        });
      }

      function formatDayHeading(iso) {
        const [y, m, d] = iso.split("-").map(Number);
        // Noon avoids any timezone edge landing on the wrong calendar day.
        const date = new Date(y, m - 1, d, 12);
        return date.toLocaleDateString(undefined, {
          weekday: "short",
          month: "short",
          day: "numeric",
        });
      }

      // A 7-day summary (Mon-Sun of the week containing currentDate) -
      // one row per day with the same capacity KPIs Day view shows for a
      // single date, so staff can spot a busy day across the week before
      // drilling into it. "View day" jumps into Day view already on that
      // date, rather than duplicating the full per-slot booking list here.
      async function loadWeek() {
        const days = weekDates(currentDate);
        const [baysRes, bookingsRes] = await Promise.all([
          supabase.from("bays").select("id").eq("is_active", true),
          supabase
            .from("bookings")
            .select("booking_date, slot, status")
            .gte("booking_date", days[0])
            .lte("booking_date", days[6])
            .in("status", ["pending", "approved"]),
        ]);

        const totalBays = (baysRes.data ?? []).length;
        const bookings = bookingsRes.data ?? [];

        document.getElementById("capacity-note").textContent =
          `Week of ${days[0]} – ${days[6]}. Each 30-minute slot holds at ` +
          `most ${totalBays} approved bus${totalBays === 1 ? "" : "es"}.`;

        const byDate = new Map(days.map((d) => [d, []]));
        for (const b of bookings) {
          byDate.get(b.booking_date)?.push(b);
        }

        const today = todayISO();
        const weekSummaries = days.map((date) => {
          const rows = byDate.get(date) ?? [];
          const approved = rows.filter((b) => b.status === "approved").length;
          const pending = rows.length - approved;
          const bySlot = new Map();
          for (const b of rows) {
            if (b.status !== "approved") continue;
            bySlot.set(b.slot, (bySlot.get(b.slot) ?? 0) + 1);
          }
          const fullSlots =
            totalBays > 0
              ? SLOTS.filter((s) => (bySlot.get(s) ?? 0) >= totalBays).length
              : 0;
          return { date, approved, pending, fullSlots };
        });

        document.getElementById("kpis").innerHTML = [
          {
            label: "Approved this week",
            value: weekSummaries.reduce((sum, w) => sum + w.approved, 0),
            unit: "buses",
          },
          {
            label: "Awaiting review",
            value: weekSummaries.reduce((sum, w) => sum + w.pending, 0),
            unit: "requests",
          },
          { label: "Active bays", value: totalBays, unit: "per slot" },
          {
            label: "Busiest day",
            value: weekSummaries.reduce(
              (max, w) => Math.max(max, w.fullSlots),
              0
            ),
            unit: "slots at capacity",
          },
        ]
          .map(
            (k) => `
            <div class="kpi">
              <div class="kpi-label">${escapeHtml(k.label)}</div>
              <div class="kpi-value">
                <strong>${k.value}</strong><span>${escapeHtml(k.unit)}</span>
              </div>
            </div>`
          )
          .join("");

        document.getElementById("grid").innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Date</th><th>Approved</th><th>Awaiting review</th>
                  <th>Slots at capacity</th><th></th>
                </tr>
              </thead>
              <tbody>
                ${weekSummaries
                  .map((w) => {
                    const atCapacity = totalBays > 0 && w.fullSlots > 0;
                    return `
                    <tr${w.date === today ? ' class="week-today"' : ""}>
                      <td data-label="Date">${escapeHtml(formatDayHeading(w.date))}${
                        w.date === today
                          ? ' <span class="tl-today-tag">Today</span>'
                          : ""
                      }</td>
                      <td class="capacity" data-label="Approved">${w.approved}</td>
                      <td data-label="Awaiting review">${w.pending}</td>
                      <td class="capacity${
                        atCapacity ? " capacity-full" : ""
                      }" data-label="Slots at capacity">${w.fullSlots} / ${SLOTS.length}</td>
                      <td><button type="button" class="btn-link" data-view-day="${escapeHtml(
                        w.date
                      )}">View day</button></td>
                    </tr>`;
                  })
                  .join("")}
              </tbody>
            </table>
          </div>
        `;

        document.querySelectorAll("[data-view-day]").forEach((btn) => {
          btn.addEventListener("click", () => {
            currentDate = btn.dataset.viewDay;
            dateInput.value = currentDate;
            viewMode = "day";
            document
              .querySelectorAll("#view-mode [data-view]")
              .forEach((b) => b.classList.toggle("is-active", b.dataset.view === "day"));
            document.getElementById("prev").textContent = "← Prev day";
            document.getElementById("next").textContent = "Next day →";
            load();
          });
        });
      }

      // Staff can move an already-approved booking to a different bay -
      // e.g. correcting a mistaken assignment, or freeing up a bay for an
      // operational reason. Options are grouped: bays at the gate this
      // route is meant to use first, then every other bay not already
      // taken for this slot (the current bay is always included, even if
      // it's outside the suggested gate, so re-opening this never loses
      // the existing value).
      function bayReassignHtml(booking, activeBays, allBookingsThisDay) {
        const takenIds = new Set(
          allBookingsThisDay
            .filter(
              (other) =>
                other.slot === booking.slot &&
                other.status === "approved" &&
                other.id !== booking.id &&
                other.bays?.id
            )
            .map((other) => other.bays.id)
        );
        const available = activeBays.filter(
          (bay) => bay.id === booking.bays?.id || !takenIds.has(bay.id)
        );

        const gate = gateForRoute(booking.route);
        const suggested = gate ? available.filter((bay) => bay.gate === gate) : [];
        const other = gate ? available.filter((bay) => bay.gate !== gate) : available;

        const optionsHtml = (list) =>
          list
            .map(
              (bay) =>
                `<option value="${bay.id}"${
                  bay.id === booking.bays?.id ? " selected" : ""
                }>${escapeHtml(bay.name)}</option>`
            )
            .join("");

        return `
          <form class="bay-reassign" data-reassign-bay="${escapeHtml(booking.id)}">
            <select>
              ${
                suggested.length
                  ? `<optgroup label="Suggested (${escapeHtml(gate)})">${optionsHtml(
                      suggested
                    )}</optgroup>`
                  : ""
              }
              ${
                other.length
                  ? `<optgroup label="${suggested.length ? "Other bays" : "Bays"}">${optionsHtml(
                      other
                    )}</optgroup>`
                  : ""
              }
            </select>
            <button type="submit" class="btn-link">Save</button>
          </form>
        `;
      }

      async function reassignBay(bookingId, bayIdRaw) {
        showMessage("message", "");
        if (!bayIdRaw) return;

        const { error } = await supabase
          .from("bookings")
          .update({ assigned_bay_id: Number(bayIdRaw) })
          .eq("id", bookingId)
          .eq("status", "approved");

        if (error) {
          // 23505 = unique violation on the approved bay/slot index.
          showMessage(
            "message",
            error.code === "23505"
              ? "That bay is already taken for this slot. Pick a different one."
              : error.message
          );
          return;
        }
        await load();
      }
    </script>
  </body>
</html>
